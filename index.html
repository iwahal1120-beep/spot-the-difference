<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>年間王座決定戦：Search Challenge EXTREME</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { text-align:center; font-family: sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        .header { padding: 5px; background: #d44d5c; color: white; height: 110px; box-sizing: border-box; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
        #timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; min-width: 65px; display: inline-block; font-variant-numeric: tabular-nums; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .inner-field { width: 98%; height: 98%; position: relative; }
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; font-size: 14px; }
        .big-item { width: 44px !important; height: 44px !important; font-size: 32px !important; }
        .target-item { z-index: 9999 !important; }
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); z-index:30000; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; color:white; padding: 20px; box-sizing: border-box; }
        .limit-text { color: #ffd700; font-weight: bold; font-size: 15px; margin-top: 10px; border: 2px solid #ffd700; padding: 8px 15px; border-radius: 50px; }
        .btn { width:100%; padding:20px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:26px; font-weight:bold; cursor:pointer; box-shadow: 0 8px 0 #8a2a35; }
    </style>
</head>
<body>

<audio id="sound-pingpong" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
<audio id="sound-warn" src="https://assets.mixkit.co/active_storage/sfx/495/495-preview.mp3" preload="auto"></audio>

<div id="start-screen">
    <h2 style="color:#ffd700; font-size: 28px;">Search Challenge!</h2>
    <p style="font-size:20px; font-weight:bold; color:#00d9ff;">年間チャンピオンに挑戦だ〜！✨</p>
    <div class="limit-text">2026年12月31日 午前0時 終了！🏆</div>
    <div style="margin-top: 20px; width: 100%; max-width: 320px;">
        <input type="text" id="player-name" placeholder="ニックネーム" maxlength="10" style="padding:15px; font-size:18px; border-radius:10px; width:100%; text-align:center; margin-bottom: 20px;">
        <button onclick="startGame()" class="btn">ゲーム開始！🚀</button>
    </div>
</div>

<div class="header">
    <div class="main-title">20円募金 - Search Challenge!</div>
    <div id="stg-desc">Ready...</div>
    <div class="status-bar">
        <div>残り: <span id="timer">30.00</span></div>
        <div>ステージ: <span id="stage-num">1</span>/20</div>
    </div>
</div>

<div class="game-area">
    <div id="inner-field" class="inner-field"></div>
</div>

<script>
const OFUSE_URL = "https://ofuse.me/d33e72b9";
const GAS_URL = "https://script.google.com/macros/s/AKfycbzvFsfk4Zp48AyJgQccCOQMX911-Itey8Sc8VH9ehnSF7J7PDpkPNayzijuO5BOBEQKaw/exec"; 

let currentStage = 0, msLeft = 3000, timerId = null, gameActive = false, foundCount = 0;
let totalTimeScore = 0, playerName = "名無しさん";
const field = document.getElementById('inner-field');
const timerDisp = document.getElementById('timer');
const pingSound = document.getElementById('sound-pingpong');
const warnSound = document.getElementById('sound-warn');

const stages = [
    { title: "1. 動物から人間を探せ！", crowd: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯"], target: "🙋‍♂️", num: 1200, isBig: false },
    { title: "2. 【超過密】人間から猫を探せ！", crowd: ["🧔","👵","👦","👧","👩‍🦰","👱‍♂️"], target: "🐱", num: 720, isBig: true },
    { title: "3. 【超過密】激しい渋滞から自転車！", crowd: ["🚗","🚕","🚙","🚌","🏎"], target: "🚲", num: 720, isBig: true },
    { title: "4. お菓子からクッキー！", crowd: ["🍬","🍭","🍫","🍩","🍮"], target: "🍪", num: 1300, isBig: false },
    { title: "5. 金貨の山から銀貨を！", crowd: ["💰"], target: "🔘", num: 1600, isBig: false },
    { title: "6. 女性たちからピエロを探せ！", crowd: ["👩","👱‍♀️","💃"], target: "🤡", num: 1400, isBig: false },
    { title: "7. 国旗（日米中露北）全部！", crowd: ["🌍","🌎","🌏"], target: "FLAGS", num: 1200, goals: 5 },
    { title: "8. 魚の群れから骨を探せ！", crowd: ["🐟","🐠","🐡"], target: "🦴", num: 1500, isBig: false },
    { title: "9. 無数の星から梅干し！", crowd: ["✨","⭐","🌟"], target: "🔴", num: 1700, isBig: false },
    { title: "10. 【石を探せ】米粒サイズの石！", crowd: ["右"], target: "石", num: 1400, isBig: false },
    { title: "11. ビル群から鳥居を！", crowd: ["🏢","🏣","🏥"], target: "⛩", num: 1300, isBig: false },
    { title: "12. リンゴからサクランボ！", crowd: ["🍎"], target: "🍒", num: 1300, isBig: false },
    { title: "13. 葉っぱからイモムシ！", crowd: ["🍃","🌿","🌱"], target: "🐛", num: 1400, isBig: false },
    { title: "14. 優勝カップを探せ！", crowd: ["⚽","🏀","⚾"], target: "🏆", num: 1300, isBig: false },
    { title: "15. 月の中からバナナ！", crowd: ["🌙"], target: "🍌", num: 1500, isBig: false },
    { title: "16. 【難問】白の中から日を探せ！", crowd: ["白"], target: "日", num: 1200, isBig: false },
    { title: "17. イカからタコを探せ！", crowd: ["🦑"], target: "🐙", num: 1400, isBig: false },
    { title: "18. 星空に潜むUFOを！", crowd: ["✨","⭐","🌟"], target: "🛸", num: 1700, isBig: false },
    { title: "19. 💩の中からアイス！", crowd: ["💩"], target: "🍦", num: 1300, isBig: false },
    { title: "20. 最終：20円募金のお願い", crowd: [], target: "FINAL", num: 0 }
];

function startGame() {
    pingSound.play().catch(e => console.log("Sound error ignored"));
    const input = document.getElementById('player-name').value;
    if(input) playerName = input;
    document.getElementById('start-screen').style.display = 'none';
    initStage();
}

function initStage() {
    field.innerHTML = "";
    foundCount = 0;
    if (currentStage >= stages.length) return;
    const stage = stages[currentStage];
    document.getElementById('stg-desc').innerText = stage.title;
    document.getElementById('stage-num').innerText = currentStage + 1;
    msLeft = 3000;
    timerDisp.style.color = "#fff";
    timerDisp.innerText = "30.00";
    
    gameActive = true;
    const usedPos = [];
    const targets = stage.target === "FLAGS" ? ["🇯🇵", "🇺🇸", "🇨🇳", "🇰🇵", "🇷🇺"] : [stage.target];
    
    targets.forEach(t => {
        const pos = { x: Math.random() * 90 + 5, y: Math.random() * 90 + 5 };
        createItem(t, true, pos, stage.isBig);
        usedPos.push(pos);
    });

    for (let i = 0; i < stage.num; i++) {
        const char = stage.crowd[Math.floor(Math.random() * stage.crowd.length)];
        let x = Math.random() * 98, y = Math.random() * 98;
        if (usedPos.some(p => Math.abs(p.x - x) < 2 && Math.abs(p.y - y) < 2)) { i--; continue; }
        createItem(char, false, {x, y}, false);
    }
    if(!timerId) startTimer();
}

function createItem(content, isTarget, pos, isBig) {
    const el = document.createElement('span');
    el.className = isTarget ? 'item target-item' : 'item';
    if (isBig) el.classList.add('big-item');
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.innerText = content;
    
    el.onclick = function() {
        if(!gameActive) return;
        if (isTarget) {
            pingSound.currentTime = 0;
            pingSound.play().catch(e => {});
            totalTimeScore += (msLeft / 100);
            foundCount++;
            if (foundCount >= (stages[currentStage].goals || 1)) {
                gameActive = false;
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.7 } });
                setTimeout(() => { currentStage++; initStage(); }, 600);
            }
        }
    };
    field.appendChild(el);
}

function startTimer() {
    timerId = setInterval(() => {
        if(gameActive) {
            msLeft--;
            timerDisp.innerText = (msLeft / 100).toFixed(2);
            if (msLeft === 1000) { 
                warnSound.play().catch(e => {}); 
                timerDisp.style.color = "red"; 
            }
            if(msLeft <= 0) endGame();
        }
    }, 10);
}

async function showFinalScreen() {
    gameActive = false;
    clearInterval(timerId);
    field.innerHTML = `<h2>集計中...</h2>`;
    const finalScore = totalTimeScore.toFixed(2);
    try {
        const response = await fetch(GAS_URL, { 
            method: 'POST', 
            body: JSON.stringify({name: playerName, score: finalScore}) 
        });
        const res = await response.json();
        field.innerHTML = `<div style="padding:20px;">
            <h2 style="color:#ffd700;">EX-COMPLETE!</h2>
            <p>Score: ${finalScore} pts</p>
            <p>順位: ${res.rank}位</p>
            <a href="${OFUSE_URL}" class="btn" style="text-decoration:none;">OFUSEで募金</a>
            <button onclick="location.reload();" class="btn" style="margin-top:10px;">最初から</button>
        </div>`;
    } catch(e) { field.innerHTML = `<h2>記録完了! Score: ${finalScore}</h2><button onclick="location.reload();" class="btn">最初から</button>`; }
}

function endGame() {
    gameActive = false;
    clearInterval(timerId);
    field.innerHTML = `<h2>TIME UP!</h2><button onclick="location.reload();" class="btn">リトライ</button>`;
}
</script>
</body>
</html>
