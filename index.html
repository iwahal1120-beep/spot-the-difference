<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>10万円争奪：Search Challenge GIGA-HARD</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* 連打による拡大（フリーズ）を徹底防止 */
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { text-align:center; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 0; overflow: hidden; }
        
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000 0%, #1a1a1a 100%); z-index:30000; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        
        .premium-box { border: 4px solid #ffd700; padding: 15px; border-radius: 15px; background: rgba(255, 215, 0, 0.15); margin: 10px 0; width: 100%; max-width: 340px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        .gift-title { color: #ffd700; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin: 5px 0; }
        
        /* ※印の赤文字：ご指定の通り「OFUSE」を含めた最大級のサイズ */
        .target-rule { 
            color: #ff4d4d; 
            font-size: 19px; /* 文字数に合わせて調整 */
            font-weight: bold; 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            margin: 15px 0; 
            display: block; 
            line-height: 1.5; 
            width: 95%; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(255,0,0,0.3);
        }

        .rules-list { text-align: left; font-size: 13px; line-height: 1.6; margin: 10px 0; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; width: 100%; max-width: 320px; border: 1px solid rgba(255,255,255,0.1); }
        
        .header { padding: 5px; background: #d44d5c; color: white; height: 110px; box-sizing: border-box; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
        #timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; min-width: 65px; display: inline-block; font-variant-numeric: tabular-nums; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .inner-field { width: 98%; height: 98%; position: relative; }
        
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; font-size: 15px; }
        .target-item { z-index: 9999 !important; font-weight: bold; }
        
        .btn { width:100%; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:22px; font-weight:bold; cursor:pointer; box-shadow: 0 6px 0 #8a2a35; }
        .btn-ofuse-top { background: #ed6c00; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .error-msg { color: #ff4d4d; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<audio id="sound-pingpong" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
<audio id="sound-warn" src="https://assets.mixkit.co/active_storage/sfx/495/495-preview.mp3" preload="auto"></audio>

<div id="start-screen">
    <h2 style="color:#ffd700; margin-bottom:5px;">Search Challenge!</h2>
    
    <div class="premium-box">
        <div style="font-size:12px;">2026年12月31日 0:00時点 タイム1位</div>
        <div class="gift-title">10万円分ギフト券</div>
        <span class="target-rule">※順位対象者はOFUSEにて募金を<br>していただいた方が、順位対象者となります。</span>
    </div>

    <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn-ofuse-top">まずはこちらから募金して参加！🚀</a>

    <div class="rules-list">
        ⚫︎ スタートは20ゲームから始まり、毎週1ゲームが追加されます。<br>
        ⚫︎ たまにバグが発生する場合がありますが、その場合はトップに戻ります。<br>
        ⚫︎ 募金時のニックネームと同じ名前で参加してください。
    </div>

    <div style="width: 100%; max-width: 320px;">
        <div id="name-error" class="error-msg">⚠️ その名前は既に使用されています</div>
        <input type="text" id="player-name" placeholder="募金時のニックネームを入力" maxlength="10" style="padding:15px; font-size:18px; border-radius:10px; width:100%; text-align:center; margin-bottom:15px; border:none; box-sizing:border-box; background: white;">
        <button onclick="startGame()" class="btn">ランキングに挑む！🏆</button>
    </div>

    <div id="top10-list" style="width:100%; max-width:320px; margin-top:20px; font-size:13px; background:rgba(255,255,255,0.1); padding:12px; border-radius:10px; border: 1px solid rgba(255,255,255,0.2);">
        ランキング読み込み中...
    </div>
</div>

<div class="header">
    <div class="main-title">募金 & Challenge！</div>
    <div id="stg-desc">Ready...</div>
    <div class="status-bar">
        <div>残り: <span id="timer">30.00</span></div>
        <div>ステージ: <span id="stage-num">1</span>/<span id="total-stg-num">20</span></div>
    </div>
</div>

<div class="game-area">
    <div id="inner-field" class="inner-field"></div>
</div>

<script>
const OFUSE_URL = "https://ofuse.me/d33e72b9";
const GAS_URL = "https://script.google.com/macros/s/AKfycbzvFsfk4Zp48AyJgQccCOQMX911-Itey8Sc8VH9ehnSF7J7PDpkPNayzijuO5BOBEQKaw/exec"; 

let currentStage = 0, msLeft = 3000, timerId = null, gameActive = false, foundCount = 0;
let totalTimeScore = 0, playerName = "名無しさん", existingNames = [];
let playableStages = [];

const field = document.getElementById('inner-field');
const timerDisp = document.getElementById('timer');
const pingSound = document.getElementById('sound-pingpong');
const warnSound = document.getElementById('sound-warn');

const allStages = [
    { title: "1. 動物から人間を探せ！", crowd: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯"], target: "🙋‍♂️", num: 1200 },
    { title: "2. 人間から猫を探せ！", crowd: ["🧔","👵","👦","👧","👩‍🦰","👱‍♂️"], target: "🐱", num: 1400 },
    { title: "3. 渋滞から自転車！", crowd: ["🚗","🚕","🚙","🚌","🏎"], target: "🚲", num: 1400 },
    { title: "4. お菓子からクッキー！", crowd: ["🍬","🍭","🍫","🍩","🍮"], target: "🍪", num: 1400 },
    { title: "5. 金貨の山から銀貨を！", crowd: ["💰"], target: "🔘", num: 1600 },
    { title: "6. ピエロを探し出せ！", crowd: ["👩","👱‍♀️","💃"], target: "🤡", num: 1500 },
    { title: "7. 国旗（日米中露北）全部！", crowd: ["🌍","🌎","🌏"], target: "FLAGS", num: 1200, goals: 5 },
    { title: "8. 魚の群れから骨を探せ！", crowd: ["🐟","🐠","🐡"], target: "🦴", num: 1600 },
    { title: "9. 無数の星から梅干し！", crowd: ["✨","⭐","🌟"], target: "🔴", num: 1800 },
    { title: "10. 【断線】切れた縦線を5箇所！", target: "LINES", num: 350, goals: 5 },
    { title: "11. ビル群から鳥居を！", crowd: ["🏢","🏣","🏥"], target: "⛩", num: 1400 },
    { title: "12. リンゴからサクランボ！", crowd: ["🍎"], target: "🍒", num: 1400 },
    { title: "13. 葉っぱからイモムシ！", crowd: ["🍃","🌿","🌱"], target: "🐛", num: 1500 },
    { title: "14. 優勝カップを探せ！", crowd: ["⚽","🏀","⚾"], target: "🏆", num: 1400 },
    { title: "15. 月の中からバナナ！", crowd: ["🌙"], target: "🍌", num: 1600 },
    { title: "16. 500匹のパンダから違う動物を5匹！", crowd: ["🐼"], target: "DIFFERENT", num: 500, goals: 5 },
    { title: "17. イカからタコを探せ！", crowd: ["🦑"], target: "🐙", num: 1500 },
    { title: "18. 星空に潜むUFOを！", crowd: ["✨","⭐","🌟"], target: "🛸", num: 1800 },
    { title: "19. 💩の中からアイス！", crowd: ["💩"], target: "🍦", num: 1400 },
    { title: "20. 年間王者へ最後の挑戦", crowd: [], target: "FINAL", num: 0 }
];

window.onload = async () => {
    try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        existingNames = data.map(d => d.name.trim());
        const list = document.getElementById('top10-list');
        list.innerHTML = `<div style="font-weight:bold; border-bottom:1px solid #fff; margin-bottom:8px; color:#ffd700;">👑 全国タイム TOP 10</div>` + 
            data.slice(0, 10).map((entry, i) => `<div style="display:flex; justify-content:space-between; padding:3px 0;"><span>${i+1}. ${entry.name}</span><span>${entry.score}s</span></div>`).join('');
    } catch(e) { document.getElementById('top10-list').innerText = "データ取得待ち..."; }
};

function getPlayableStages() {
    const START_DATE = new Date("2026-02-01");
    const diffWeeks = Math.floor((new Date() - START_DATE) / (1000 * 60 * 60 * 24 * 7));
    const count = Math.min(allStages.length - 1, 19 + Math.max(0, diffWeeks));
    const pool = allStages.slice(0, count);
    pool.push(allStages[allStages.length - 1]);
    return pool;
}

function startGame() {
    const input = document.getElementById('player-name').value.trim();
    if (!input) { alert("ニックネームを入力してください"); return; }
    if (existingNames.includes(input)) { document.getElementById('name-error').style.display = "block"; return; }
    playerName = input;
    playableStages = getPlayableStages();
    document.getElementById('total-stg-num').innerText = playableStages.length;
    pingSound.play().then(()=>pingSound.pause()).catch(()=>{});
    warnSound.play().then(()=>warnSound.pause()).catch(()=>{});
    document.getElementById('start-screen').style.display = 'none';
    initStage();
}

function initStage() {
    field.innerHTML = "";
    foundCount = 0;
    if (currentStage >= playableStages.length) return;
    const stage = playableStages[currentStage];
    document.getElementById('stg-desc').innerText = stage.title;
    document.getElementById('stage-num').innerText = currentStage + 1;
    msLeft = 3000;
    timerDisp.style.color = "#fff";
    timerDisp.innerText = "30.00";
    gameActive = true;
    if (stage.target === "LINES") { createLineStage(stage); }
    else if (stage.target === "DIFFERENT") { createPandaStage(stage); }
    else if (stage.target === "FINAL") { showFinalScreen(); }
    else { createNormalStage(stage); }
    if(!timerId) startTimer();
}

function createNormalStage(stage) {
    const usedPos = [];
    const targets = stage.target === "FLAGS" ? ["🇯🇵", "🇺🇸", "🇨🇳", "🇰🇵", "🇷🇺"] : [stage.target];
    targets.forEach(t => {
        const pos = { x: Math.random() * 90 + 5, y: Math.random() * 90 + 5 };
        createItem(t, true, pos);
        usedPos.push(pos);
    });
    for (let i = 0; i < stage.num; i++) {
        const char = stage.crowd[Math.floor(Math.random() * stage.crowd.length)];
        let x = Math.random() * 98, y = Math.random() * 98;
        if (usedPos.some(p => Math.abs(p.x - x) < 2.5 && Math.abs(p.y - y) < 2.5)) { i--; continue; }
        createItem(char, false, {x, y});
    }
}

function createLineStage(stage) {
    let brokenCount = 0;
    for (let i = 0; i < stage.num; i++) {
        const el = document.createElement('div');
        el.className = 'line-item';
        el.style.left = Math.random() * 98 + "%";
        el.style.top = Math.random() * 92 + "%";
        if (brokenCount < 5 && Math.random() < 0.05) {
            el.classList.add('broken-line', 'target-item');
            el.onclick = (e) => { e.stopPropagation(); handleFound(el); };
            brokenCount++;
        }
        field.appendChild(el);
    }
}

function createPandaStage(stage) {
    const fakes = ["🐨", "🐻‍❄️", "🐰", "🐹"];
    let count = 0;
    for (let i = 0; i < stage.num; i++) {
        let char = "🐼", isT = false;
        if (count < 5 && Math.random() < 0.04) {
            char = fakes[Math.floor(Math.random()*fakes.length)];
            isT = true; count++;
        }
        createItem(char, isT, {x: Math.random()*96, y: Math.random()*96});
    }
}

function createItem(content, isTarget, pos) {
    const el = document.createElement('span');
    el.className = isTarget ? 'item target-item' : 'item';
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    if (content === "🔴" && isTarget) el.style.color = "#ff8888";
    el.innerText = content;
    if (isTarget) el.onclick = (e) => { e.stopPropagation(); handleFound(el); };
    field.appendChild(el);
}

function handleFound(el) {
    if(!gameActive || el.dataset.clicked === "true") return;
    el.dataset.clicked = "true";
    pingSound.currentTime = 0;
    pingSound.play().catch(()=>{});
    el.style.transform = "scale(2.5) rotate(360deg)";
    el.style.opacity = "0.5";
    totalTimeScore += (msLeft / 100);
    foundCount++;
    const goals = (playableStages[currentStage].goals || 1);
    if (foundCount >= goals) {
        gameActive = false;
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
        setTimeout(() => { currentStage++; initStage(); }, 500);
    }
}

function startTimer() {
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
        if(gameActive) {
            msLeft--;
            timerDisp.innerText = (msLeft / 100).toFixed(2);
            if (msLeft === 1000) { warnSound.play().catch(()=>{}); timerDisp.style.color = "red"; }
            if(msLeft <= 0) { gameActive = false; clearInterval(timerId); endGame(); }
        }
    }, 10);
}

async function showFinalScreen() {
    gameActive = false;
    clearInterval(timerId);
    field.innerHTML = `<h2 style="color:#d44d5c;">順位を送信中...</h2>`;
    const finalScore = totalTimeScore.toFixed(2);
    try {
        await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({name: playerName, score: finalScore}) });
        location.reload(); 
    } catch(e) { field.innerHTML = `<h2>送信エラー</h2><button onclick="location.reload();" class="btn">トップへ</button>`; }
}

function endGame() { 
    field.innerHTML = `<h2>TIME UP!</h2><p>トップ画面から再挑戦！</p><button onclick="location.reload();" class="btn">トップへ</button>`; 
}
</script>
</body>
</html>
