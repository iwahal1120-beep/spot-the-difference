<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>年間王座決定戦：Search Challenge EXTREME</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { text-align:center; font-family: sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        .header { padding: 5px; background: #d44d5c; color: white; height: 110px; box-sizing: border-box; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
        .main-title { font-size: 16px; font-weight: bold; margin: 0; }
        .status-bar { display: flex; justify-content: center; gap: 20px; font-size: 16px; margin-top: 5px; font-weight: bold; }
        #stg-desc { font-size: 12px; background: white; color: #d44d5c; display: inline-block; padding: 2px 10px; border-radius: 15px; margin-top: 3px; width: 90%; }
        #timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; min-width: 65px; display: inline-block; font-variant-numeric: tabular-nums; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .inner-field { width: 95%; height: 95%; position: relative; }
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; font-size: 26px; }
        .target-item { z-index: 9999 !important; font-size: 28px !important; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-weight: bold; border-radius: 8px; font-size: 18px; text-align: center; border: none; cursor: pointer; text-decoration: none; }
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:30000; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; color:white; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .ranking-box { width: 100%; max-width: 400px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-top: 15px; font-size: 14px; }
        .limit-text { color: #fff; font-weight: bold; font-size: 14px; margin-top: 8px; background: #d44d5c; padding: 5px 10px; border-radius: 5px; border: 2px solid #ffd700; }
    </style>
</head>
<body>

<audio id="sound-pig" src="https://assets.mixkit.co/active_storage/sfx/2312/2312-preview.mp3" preload="auto"></audio>
<audio id="bgm" src="https://assets.mixkit.co/active_storage/sfx/131/131-preview.mp3" loop preload="auto"></audio>

<div id="start-screen">
    <h2 style="color:#ffd700; margin-bottom:5px; font-size: 24px;">Search Challenge!</h2>
    <p style="font-size:18px; font-weight:bold; color:#00d9ff; margin: 10px 0;">年間チャンピオンに挑戦だ〜！✨</p>
    <div class="limit-text">2026年12月31日 午前0時 終了！🏆</div>
    
    <div style="margin-top: 15px; width: 100%; max-width: 320px;">
        <input type="text" id="player-name" placeholder="ニックネーム" maxlength="10" style="padding:12px; font-size:18px; border-radius:8px; border:none; width:100%; text-align:center; box-sizing: border-box; background: #eee;">
        <button onclick="startGame()" style="width:100%; margin-top:15px; padding:18px; background:#d44d5c; color:white; border:none; border-radius:12px; font-size:24px; font-weight:bold; cursor:pointer; box-shadow: 0 6px 0 #8a2a35; transition: 0.1s;">ゲーム開始！🚀</button>
    </div>

    <div class="ranking-box">
        <div style="font-weight:bold; color:#ffd700; margin-bottom:8px; border-bottom:2px solid #ffd700;">現在の全国TOP 10</div>
        <div id="top10-list">読み込み中...</div>
    </div>
</div>

<div class="header">
    <div class="main-title">20円募金 - Search Challenge!</div>
    <div id="stg-desc">Ready...</div>
    <div class="status-bar">
        <div>残り: <span id="timer">30.00</span></div>
        <div>ステージ: <span id="stage-num">1</span>/20</div>
    </div>
</div>

<div class="game-area">
    <div id="inner-field" class="inner-field"></div>
</div>

<script>
const OFUSE_URL = "https://ofuse.me/d33e72b9";
const GAS_URL = "https://script.google.com/macros/s/AKfycbzvFsfk4Zp48AyJgQccCOQMX911-Itey8Sc8VH9ehnSF7J7PDpkPNayzijuO5BOBEQKaw/exec"; 

let currentStage = 0, msLeft = 3000, timerId = null, gameActive = false, foundCount = 0;
let totalTimeScore = 0, playerName = "名無しさん";
const field = document.getElementById('inner-field');
const timerDisp = document.getElementById('timer');
const pigSound = document.getElementById('sound-pig');
const bgm = document.getElementById('bgm');

// AIボイスをさらに可愛く設定
function playAIVoice() {
    const msg = new SpeechSynthesisUtterance();
    msg.text = "どんどん増える、見つけてゲーム！年間チャンピオンに挑戦だ〜！";
    msg.lang = 'ja-JP';
    msg.pitch = 1.6; // 声を高く（可愛く）
    msg.rate = 1.2;  // 少し早口に
    msg.volume = 1.0;
    window.speechSynthesis.speak(msg);
}

window.onload = async () => {
    try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        const list = document.getElementById('top10-list');
        list.innerHTML = data.map((entry, i) => `<div style="display:flex; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.2); padding:5px 0;"><span>${i+1}位 ${entry.name}</span><span>${entry.score} pts</span></div>`).join('');
    } catch(e) { document.getElementById('top10-list').innerText = "ランキング取得中..."; }
};

function startGame() {
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
    playAIVoice();
    const input = document.getElementById('player-name').value;
    if(input) playerName = input;
    document.getElementById('start-screen').style.display = 'none';
    initStage();
}

function initStage() {
    field.innerHTML = "";
    foundCount = 0;
    if (currentStage >= stages.length) return;
    const stage = stages[currentStage];
    document.getElementById('stg-desc').innerText = stage.title;
    document.getElementById('stage-num').innerText = currentStage + 1;
    msLeft = 3000;
    timerDisp.innerText = (msLeft / 100).toFixed(2);
    field.parentElement.style.background = (currentStage === 8 || currentStage === 17) ? "#000" : "#fff";
    if (stage.target === "FINAL") { showFinalScreen(); return; }

    gameActive = true;
    const usedPositions = [];
    const targets = stage.target === "FLAGS" ? ["🇯🇵", "🇺🇸", "🇨🇳", "🇰🇵", "🇷🇺"] : [stage.target];
    
    targets.forEach(t => {
        const pos = { x: Math.random() * 80 + 10, y: Math.random() * 80 + 10 };
        createItem(t, true, pos);
        usedPositions.push(pos);
    });

    for (let i = 0; i < stage.num; i++) {
        const char = stage.crowd[Math.floor(Math.random() * stage.crowd.length)];
        let x = Math.random() * 96, y = Math.random() * 96;
        if (currentStage === 9 || currentStage === 15) {
            let tooClose = usedPositions.some(p => Math.abs(p.x - x) < 7 && Math.abs(p.y - y) < 7);
            if (tooClose) { i--; continue; }
        }
        createItem(char, false, {x, y});
    }
    if(!timerId) startTimer();
}

// 難易度を大幅に上方修正（全体的にアイテム数を激増）
const stages = [
    { title: "1. 動物から人間を探せ！", crowd: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯"], target: "🙋‍♂️", num: 750, goals: 1 },
    { title: "2. 人間から猫を探せ！", crowd: ["🧔","👵","👦","👧","👩‍🦰","👱‍♂️","👳‍♀️"], target: "🐱", num: 600, goals: 1 },
    { title: "3. 激しい渋滞から自転車！", crowd: ["🚗","🚕","🚙","🚌","🏎","🚓"], target: "🚲", num: 650, goals: 1 },
    { title: "4. お菓子からクッキー！", crowd: ["🍬","🍭","🍫","🍩","🍮","🍰"], target: "🍪", num: 800, goals: 1 },
    { title: "5. ドル金貨から銀貨を！", crowd: ["💰"], target: "🔘", num: 1000, goals: 1 },
    { title: "6. 大勢の女性からピエロを！", crowd: ["👩","👩‍🦰","👱‍♀️","👩‍🦳","👩‍🦱","💃"], target: "🤡", num: 900, goals: 1 },
    { title: "7. 国旗（日米中露北）全部！", crowd: ["🌍","🌎","🌏","🧔","👧"], target: "FLAGS", num: 800, goals: 5 },
    { title: "8. 魚の群れから骨を探せ！", crowd: ["🐟","🐠","🐡","🦈"], target: "🦴", num: 950, goals: 1 },
    { title: "9. 無数の星から梅干し！", crowd: ["✨","⭐","🌟"], target: "🔴", num: 1100, goals: 1 },
    { title: "10. 【石を探せ】赤い石を救え！", crowd: ["右"], target: "石", num: 400, goals: 1 },
    { title: "11. ビル群から鳥居を！", crowd: ["🏢","🏣","🏥","🏦","🏨"], target: "⛩", num: 900, goals: 1 },
    { title: "12. リンゴからサクランボ！", crowd: ["🍎"], target: "🍒", num: 900, goals: 1 },
    { title: "13. 400枚の葉からイモムシ！", crowd: ["🍃","🌿","🌱"], target: "🐛", num: 950, goals: 1 },
    { title: "14. 優勝カップを探せ！", crowd: ["⚽","🏀","🏈","⚾","🎾","🏐"], target: "🏆", num: 950, goals: 1 },
    { title: "15. 月の中からバナナ！", crowd: ["🌙"], target: "🍌", num: 1000, goals: 1 },
    { title: "16. 難問！「白」の中から「日」！", crowd: ["白"], target: "日", num: 850, goals: 1 },
    { title: "17. イカからタコを探せ！", crowd: ["🦑"], target: "🐙", num: 950, goals: 1 },
    { title: "18. 星空に潜むUFOを！", crowd: ["✨","⭐","🌟"], target: "🛸", num: 1100, goals: 1 },
    { title: "19. 💩の中からアイス！", crowd: ["💩"], target: "🍦", num: 900, goals: 1 },
    { title: "20. 最終：全クリ！20円募金のお願い", crowd: [], target: "FINAL", num: 0, goals: 1 }
];

function createItem(content, isTarget, pos) {
    const el = document.createElement('span');
    el.className = isTarget ? 'item target-item' : 'item';
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.style.zIndex = isTarget ? "9999" : Math.floor(Math.random() * 1000);
    if (content === "💰") el.style.color = "#FFD700";
    if (content === "🔴" && isTarget) el.style.color = "#b30000";
    el.innerText = content;
    el.onclick = function() {
        if(!gameActive) return;
        if (isTarget) {
            if (this.dataset.found === "true") return;
            this.dataset.found = "true";
            pigSound.currentTime = 0;
            pigSound.play().catch(() => {});
            this.style.transform = "scale(2.5) rotate(360deg)";
            this.style.transition = "0.3s";
            totalTimeScore += (msLeft / 100);
            foundCount++;
            if (foundCount >= stages[currentStage].goals) {
                gameActive = false;
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.7 } });
                setTimeout(() => { currentStage++; initStage(); }, 800);
            }
        } else { this.style.opacity = "0.2"; }
    };
    field.appendChild(el);
}

function startTimer() {
    timerId = setInterval(() => {
        if(gameActive) {
            msLeft--;
            timerDisp.innerText = (msLeft / 100).toFixed(2);
            if(msLeft <= 0) endGame();
        }
    }, 10);
}

async function showFinalScreen() {
    gameActive = false;
    clearInterval(timerId);
    bgm.pause();
    var end = Date.now() + 6 * 1000;
    (function frame() {
      confetti({ particleCount: 20, angle: 60, spread: 80, origin: { x: 0 }, colors: ['#ff0000', '#ffd700'] });
      confetti({ particleCount: 20, angle: 120, spread: 80, origin: { x: 1 }, colors: ['#ff0000', '#ffd700'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    }());

    const finalScore = totalTimeScore.toFixed(2);
    field.innerHTML = `<h2>集計中...</h2>`;
    let rankInfo = "";
    try {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        const weekNum = Math.ceil((((now - start) / 86400000) + start.getDay() + 1) / 7);
        const response = await fetch(GAS_URL, { 
            method: 'POST', 
            body: JSON.stringify({name: playerName, score: finalScore, week: weekNum}) 
        });
        const res = await response.json();
        rankInfo = `今週の順位: ${res.total} 人中 ${res.rank} 位！`;
    } catch(e) { rankInfo = "記録完了！"; }
    
    field.innerHTML = `<div style="padding:20px; overflow-y:auto; height:100%;">
            <h2 style="color:#ffd700; text-shadow: 2px 2px 4px #000; font-size:30px;">EX-COMPLETE!</h2>
            <div style="font-size:24px; font-weight:bold; color:#d44d5c; margin:15px 0;">${rankInfo}</div>
            <p>Score: ${finalScore} pts</p>
            <div style="background:#fff; border:3px solid #d44d5c; border-radius:15px; padding:20px; margin-bottom:20px;">
                <p>2026年12月31日の最終決戦まで<br>王座を守り抜こう！🏆</p>
                <a href="${OFUSE_URL}" target="_blank" class="btn btn-ofuse" style="background:#ed6c00; color:#fff;">OFUSEで応援を送る（20円〜）</a>
            </div>
            <button onclick="resetGame();" class="btn btn-retry">最初から遊ぶ</button></div>`;
}

function resetGame() {
    field.innerHTML = "";
    window.location.reload();
}

function endGame() {
    gameActive = false;
    clearInterval(timerId);
    bgm.pause();
    field.innerHTML = `<div style="padding:20px;"><h2>TIME UP!</h2><button onclick="resetGame();" class="btn btn-retry">リトライ</button></div>`;
}
</script>
</body>
</html>
