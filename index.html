<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Search Challenge GIGA-HARD 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { text-align:center; font-family: sans-serif; background: #000; margin: 0; overflow: hidden; }
        
        /* 漆黒・金枠・オレンジボタン：トップ画面の完全再現 */
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000, #1a1a1a); z-index:99999; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; overflow-y: auto; }
        .premium-box { border: 3px solid #ffd700; padding: 15px; border-radius: 15px; background: rgba(255,215,0,0.1); margin: 10px 0; width: 100%; max-width: 380px; }
        .btn-ofuse-top { background: #ed6c00; color: white; padding: 14px; border-radius: 10px; text-decoration: none; font-size: 16px; font-weight: bold; display: block; margin-bottom: 10px; width: 100%; border: 2px solid #fff; }
        .terms-box { font-size: 11px; color: #ccc; margin-top: 15px; text-align: left; width: 100%; max-width: 320px; line-height: 1.5; border-top: 1px solid #444; padding-top: 10px; }

        .header { background: #d44d5c; color: white; height: 110px; padding: 5px; position: relative; z-index: 50000; }
        #timer { color: #fff; background: #000; padding: 2px 10px; border-radius: 5px; font-family: monospace; font-size: 28px; min-width: 100px; display: inline-block; }
        
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        
        /* 判定の分離：ターゲット(最前面) vs ハズレ(背景・判定なし) */
        .target-item { position: absolute; z-index: 80000 !important; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 42px; cursor: pointer; }
        .miss-item { position: absolute; z-index: 10; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 26px; pointer-events: none; }

        .btn { width:100%; padding:16px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:12px; font-size:18px; font-weight:bold; box-shadow: 0 4px 0 #8a2a35; cursor:pointer; }
        input { padding:12px; font-size:16px; width:100%; margin-bottom:10px; border-radius:8px; border:none; color:#000; }
    </style>
</head>
<body onload="loadRanking()">

<div id="start-screen">
    <h1 style="color:#ffd700; margin-bottom:5px; font-size:24px;">Search Challenge GIGA-HARD</h1>
    <div class="premium-box">
        <div style="font-size:18px; font-weight:bold; color:#ffd700;">1位に10万円ギフトカード贈呈</div>
        <div style="font-size:12px;">Deadline: 2026.12.31 0:00(JST)</div>
    </div>
    <div id="ranking-display" style="font-size:14px; margin:10px; background:rgba(255,255,255,0.1); padding:10px; border-radius:8px; width:100%; max-width:320px;"></div>
    
    <div style="width: 100%; max-width: 320px;">
        <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn-ofuse-top">応援して10万円に挑戦！🚀</a>
        <input type="text" id="p-name" placeholder="Nickname">
        <input type="password" id="p-pass" placeholder="4-digit Pass">
        <button onclick="startGame()" class="btn">START / 26 STAGES 🏆</button>
        
        <div class="terms-box">
            【規約 / Terms】<br>
            ・本ゲームは無料です。 / Free to play.<br>
            ・2026.12.31まで順次、新ステージが追加されます。<br>
            ・不正行為、重複アカウントは賞品対象外となります。
        </div>
    </div>
</div>

<div class="header">
    <div id="stg-desc" style="font-weight:bold; font-size:18px;">Ready...</div>
    <div>TIME: <span id="timer">30.00</span> | Stage: <span id="stg-n">1</span>/26</div>
</div>
<div class="game-area" id="field"></div>

<script>
let cur = 0, ms = 3000, tid = null, active = false, found = 0, total_score = 0, pName, pPass;

// ★26ステージすべての物語：一切の妥協なく記述
const stages = [
    { t: "1. Human! / 人間", c: ["🐶","🐱","🐭"], g: "🙋‍♂️", n: 400 },
    { t: "2. Cat! / 猫 (800匹!)", c: ["🧔","👵","👦"], g: "🐱", n: 800 },
    { t: "3. Bicycle! / 自転車", c: ["🚗","🚕","🚙"], g: "🚲", n: 600 },
    { t: "4. Cookie! / クッキー", c: ["🍬","🍭","🍫"], g: "🍪", n: 550 },
    { t: "5. YELLOW vs SILVER", c: ["●"], g: "●", n: 500, goals: 5, type: "silver" },
    { t: "6. Small Clown! / 小さいピエロ", c: ["💃","🕺"], g: "🤡", n: 600, type: "small" },
    { t: "7. 5 Flags! / 国旗5つ", c: ["🌏","🌎"], g: "🏁", n: 500, goals: 5 },
    { t: "8. Bone! / 骨を探せ", c: ["🐟","🐠"], g: "🦴", n: 600 },
    { t: "9. 5 Pale Pink Hearts! / 桃色5個", c: ["⭐"], g: "🩷", n: 700, goals: 5, type: "pale" },
    { t: "10. Mirror 'あ'", c: ["あ"], g: "あ", n: 500, goals: 5, type: "mirror" },
    { t: "11. Torii! / 鳥居を探せ", c: ["🏢","🏨"], g: "⛩️", n: 600 },
    { t: "12. Cherries! / さくらんぼ", c: ["🍎","🍅"], g: "🍒", n: 600 },
    { t: "13. Bug! / 虫を探せ", c: ["🍃","🌱"], g: "🐛", n: 600 },
    { t: "14. Trophy! / トロフィー", c: ["⚽","🏀"], g: "🏆", n: 600 },
    { t: "15. Banana! / バナナ", c: ["🌙","🌛"], g: "🍌", n: 600 },
    { t: "16. 5 Pandas! / パンダ5匹", c: ["🐨","🐻"], g: "🐼", n: 500, goals: 5 },
    { t: "17. Octopus! / タコを探せ", c: ["🦑","🦀"], g: "🐙", n: 650 },
    { t: "18. Faint UFO! / 薄いUFO", c: ["✨","🌟"], g: "🛸", n: 700, type: "ufo" },
    { t: "19. Ice Creams! / アイス5", c: ["🍭","🍩"], g: "🍦", n: 550, goals: 5 },
    { t: "20. Eyes! / 目を探せ", c: ["👁️"], g: "👀", n: 800, goals: 5 },
    { t: "21. Lady! / 女性を探せ", c: ["🧔","👴"], g: "💃", n: 600 },
    { t: "22. Gift Box! / プレゼント箱", c: ["📦"], g: "🎁", n: 500, goals: 3 },
    { t: "23. Chick! / ひよこ", c: ["🐓","🥚"], g: "🐥", n: 750, goals: 5 },
    { t: "24. Red! / 赤一点", c: ["🔵","⚫"], g: "🔴", n: 300 },
    { t: "25. Spiral / 渦", c: ["🌀"], g: "🍥", n: 200, goals: 5 },
    { t: "26. FINAL / 最後は笑顔", c: ["😭","😢"], g: "😊", n: 999 },
    { t: "END", g: "FINAL" }
];

function loadRanking() {
    const recs = JSON.parse(localStorage.getItem('gigaHard_ranks') || '[]');
    document.getElementById('ranking-display').innerHTML = recs.length ? "🏆 TOP SCORE: " + recs[0].score.toFixed(2) : "12.31 10万円争奪戦！";
}

function startGame() {
    pName = document.getElementById('p-name').value.trim(); 
    pPass = document.getElementById('p-pass').value.trim();
    if(!pName || pPass.length<4) return alert("Nickname & 4-digit Pass required");
    document.getElementById('start-screen').style.display='none';
    cur = 0; total_score = 0; init();
}

function init() {
    const f = document.getElementById('field'); f.innerHTML = "";
    found = 0; ms = 3000; active = true; 
    const s = stages[cur];
    if(!s || s.g === "FINAL") return end();
    document.getElementById('stg-desc').innerText = s.t;
    document.getElementById('stg-n').innerText = cur + 1;

    // 1. 正解(ターゲット)生成：この要素だけがクリックに反応する
    const goals = s.goals || 1;
    for(let j=0; j<goals; j++) {
        const el = document.createElement('div');
        el.className = 'target-item';
        el.style.left = (5 + Math.random() * 85) + "%";
        el.style.top = (5 + Math.random() * 85) + "%";
        
        if(s.type === "pale") { el.innerText = "🩷"; el.style.opacity = "0.45"; }
        else if(s.type === "silver") { el.style.background="#E0E0E0"; el.style.borderRadius="50%"; el.innerText=""; el.style.width="18px"; el.style.height="18px"; }
        else if(s.type === "small") { el.innerText = s.g; el.style.fontSize = "16px"; }
        else if(s.type === "mirror") { el.innerText = s.g; el.style.transform = "scaleX(-1)"; }
        else if(s.type === "ufo") { el.innerText = "🛸"; el.style.opacity = "0.2"; }
        else el.innerText = s.g;

        el.onmousedown = (e) => {
            e.stopPropagation();
            if(!active || el.style.visibility === "hidden") return;
            el.style.visibility = "hidden";
            found++; total_score += (ms/100);
            if(found >= goals) nextStage();
        };
        f.appendChild(el);
    }

    // 2. 背景(ハズレ)生成：pointer-events:noneで判定を完全消去
    for(let i=0; i<s.n; i++) {
        const el = document.createElement('span');
        el.className = 'miss-item';
        el.style.left = (Math.random() * 95) + "%";
        el.style.top = (Math.random() * 95) + "%";
        if(s.type === "silver") { el.style.background="#FFD700"; el.style.borderRadius="50%"; el.innerText=""; el.style.width="18px"; el.style.height="18px"; }
        else if(s.type === "pale") { el.innerText = "⭐"; el.style.color = "#FFD700"; }
        else el.innerText = s.c[Math.floor(Math.random()*s.c.length)];
        f.appendChild(el);
    }

    if(tid) clearInterval(tid);
    tid = setInterval(() => {
        if(!active) return; ms--;
        document.getElementById('timer').innerText = (ms/100).toFixed(2);
        if(ms <= 0) timeUp();
    }, 10);
}

function timeUp() {
    active = false; clearInterval(tid);
    alert("TIME UP! Challenge again.");
    document.getElementById('start-screen').style.display='flex';
}

function nextStage() {
    active = false; clearInterval(tid);
    confetti({particleCount:100, spread: 70, origin: { y: 0.6 }});
    setTimeout(() => { cur++; init(); }, 600);
}

function end() {
    active = false; clearInterval(tid);
    let recs = JSON.parse(localStorage.getItem('gigaHard_ranks') || '[]');
    recs.push({name: pName, score: total_score}); recs.sort((a,b)=>b.score-a.score);
    localStorage.setItem('gigaHard_ranks', JSON.stringify(recs.slice(0,3)));
    document.getElementById('field').innerHTML = `<h2 style="color:#000;margin-top:50px;">🏆 26 STAGES CLEAR!</h2><p>FINAL SCORE: ${total_score.toFixed(2)}</p><button onclick="location.reload()" class="btn">TOPに戻る</button>`;
}
</script>
</body>
</html>
