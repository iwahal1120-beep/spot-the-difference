<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Search Challenge GIGA-HARD 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { text-align:center; font-family: 'Helvetica Neue', Arial, sans-serif; background: #000; margin: 0; overflow: hidden; color: #fff; }
        
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000 0%, #1a1a1a 100%); z-index:99999; display:flex; flex-direction:column; align-items:center; overflow-y: auto; padding-bottom: 50px; }
        .prize-header { background: linear-gradient(90deg, #ffd700, #fff, #ffd700); color: #000; font-weight: bold; padding: 12px; font-size: 16px; width: 100%; border-bottom: 2px solid #000; }
        .btn-ofuse { background: #ed6c00; color: white; padding: 16px; border-radius: 12px; text-decoration: none; font-size: 16px; font-weight: bold; display: block; margin: 15px auto; width: 90%; max-width: 340px; border: 2px solid #fff; line-height: 1.2; }
        
        .header { background: #d44d5c; color: white; height: 60px; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; position: relative; z-index: 50000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        #timer { color: #fff; background: #000; padding: 4px 10px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 24px; min-width: 100px; border: 2px solid #666; }
        #timer.timer-danger { color: #ff0000 !important; animation: flash 0.5s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .game-area { width: 100vw; height: calc(100vh - 60px); position: relative; background: #fff; overflow: hidden; }
        
        /* 【2番：最強のイエロー化フィルタ】 */
        /* これにより絵文字の色を無視して一律イエローのシルエットにします */
        .force-yellow {
            filter: brightness(0) saturate(100%) invert(91%) sepia(94%) saturate(5411%) hue-rotate(359deg) brightness(105%) contrast(106%) !important;
        }

        /* 9番：極小五角形 (14px) */
        .pentagon-filled-tiny {
            position: absolute; width: 14px; height: 14px; background: #ffff00;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            z-index: 80000; cursor: pointer;
        }

        .target-item { position: absolute; z-index: 80000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; width: 44px; height: 44px; }
        .miss-item { position: absolute; z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #000; width: 25px; height: 25px; }
        
        @keyframes moveBg { 0% { transform: translate(0,0); } 25% { transform: translate(100px, 50px); } 50% { transform: translate(50px, 100px); } 75% { transform: translate(-50px, 50px); } 100% { transform: translate(0,0); } }
        .moving-bg { animation: moveBg 5s infinite linear; }

        .btn-start { width:90%; max-width:340px; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:14px; font-size:20px; font-weight:bold; }
        input { padding:14px; font-size:16px; width:90%; max-width:340px; margin-bottom:10px; border-radius:10px; border:1px solid #ccc; color:#000; }
    </style>
</head>
<body onload="renderRank()">

<div id="start-screen">
    <div class="prize-header">🏆 1位：10万円ギフト券 / 1st Prize: 100,000 JPY</div>
    <h1 style="color:#ffd700; font-size:24px; margin: 20px 0 10px;">GIGA-HARD 2026</h1>
    <div style="width: 100%; max-width: 340px;">
        <input type="text" id="p-name" placeholder="Nickname">
        <input type="password" id="p-pass" placeholder="4-digit Pass">
        <button onclick="startGame()" class="btn-start">GAME START</button>
        <div id="rank-list" style="margin-top:20px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; font-size:12px;"></div>
    </div>
</div>

<div class="header">
    <div class="header-top"><div>Stage <span id="stg-n">1</span>/26</div><div id="timer">30.00</div></div>
    <div id="stg-guide" style="font-size:12px; color:#ffff00; font-weight:bold;"></div>
</div>
<div class="game-area" id="field"></div>

<script>
let cur = 0, ms = 3000, active = false, found = 0, audioCtx = null, choiceInterval = null;

function renderRank() {
    const data = [["KING",10.05],["ACE",11.20],["SORA",12.45],["NANA",13.00],["BIRD",14.10],["FAST",14.88]];
    document.getElementById('rank-list').innerHTML = data.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:2px 0;"><span>${i+1}. ${r[0]}</span><span>${r[1]}s</span></div>`).join('');
}

function playBeep(f, d) {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = f; o.type = "square";
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
    o.start(); o.stop(audioCtx.currentTime + d);
}

const stages = [
    {t:"1. 人 / Human", c:["🐶","🐱","🐭"], g:"🙋‍♂️", n:600},
    {t:"2. 猫(イエロー地獄) / Find Cat", c:["🐶","🐭","🐹"], g:"🐱", n:750, type:"cat_trap"}, // 2番：フィルタ適用
    {t:"3. 自転車 / Bicycle", c:["🚗","🚕","🚙"], g:"🚲", n:700},
    {t:"4. クッキー / Cookie", c:["🍬","🍭","🍫"], g:"🍪", n:700, type:"tiny_cookie"},
    {t:"5. グレー丸5(イエロー700) / 5 Gray", type:"silver_hard", n:700, goals:5},
    {t:"6. ピエロ(極小) / Tiny Clown", c:["💃","🕺"], g:"🤡", n:600, type:"tiny_clown"},
    {t:"7. 国旗5 / 5 Flags", c:["🌏","🌎"], g:["🇯🇵","🇺🇸","🇫🇷","🇩🇪","🇰🇷"], n:500, goals:5},
    {t:"8. 骨を探せ！ / Find Bone", c:["🐟","🐠"], g:"🦴", n:780},
    {t:"9. 五角形5個(40%小) / 5 Pentagons", c:["⭐"], n:900, goals:5, type:"penta_task"}, // 9番
    {t:"10. 逆「あ」x5 / Mirror 'あ'", c:["あ"], g:"あ", n:800, goals:5, type:"mirror_distinct"},
    {t:"11. 鳥居 / Torii", c:["🏢","🏨"], g:"⛩️", n:800},
    {t:"12. Cherry", c:["🍎","🍅"], g:"🍒", n:600},
    {t:"13. 虫(40%小) / Tiny Bug", c:["🍃","🌱"], g:"🐛", n:600, type:"tiny_bug"}, // 13番
    {t:"14. Trophy", c:["⚽","🏀"], g:"🏆", n:600},
    {t:"15. 🍌 / Banana", c:["🌙","🌛"], g:"🍌", n:700},
    {t:"16. 🐼x5 / 5 Pandas", c:["🐨","🐻"], g:"🐼", n:500, goals:5},
    {t:"17. Octopus", c:["🦑","🦀"], g:"🐙", n:700},
    {t:"18. UFO(透過) / Faint UFO", c:["✨","🌟"], g:"🛸", n:800, type:"ufo_trap"},
    {t:"19. 🍦x5 / Ice", c:["🍭","🍩"], g:"🍦", n:600, goals:5},
    {t:"20. 👀x3 / Eyes", c:["👁️"], g:"👀", n:1000, goals:3},
    {t:"21. 💃 / Lady", c:["🧔","👴"], g:"💃", n:600},
    {t:"22. 静止■x5 / 5 Still Square", c:["■"], g:"■", n:500, goals:5, type:"moving_bg"},
    {t:"23. ヒヨコ5羽 / 5 Chicks", c:["🥚","🐓"], g:"🐥", n:1200, goals:5},
    {t:"24. 運命の選択 / Fate", type:"choice"},
    {t:"25. 螺旋切れ目x5 / 5 Micro Gaps", type:"spiral", goals:5},
    {t:"26. FINAL / Smile!", c:["😭","😢","😡"], g:"😊", n:1500}
];

function startGame() {
    if(!document.getElementById('p-name').value || !document.getElementById('p-pass').value) return alert("Enter Name & PW");
    document.getElementById('start-screen').style.display='none';
    cur = 0; init();
}

function init() {
    const f = document.getElementById('field'); f.innerHTML = ""; active = true; ms = 3000; found = 0;
    document.getElementById('timer').classList.remove('timer-danger');
    if(choiceInterval) { clearInterval(choiceInterval); choiceInterval = null; }
    const s = stages[cur];
    document.getElementById('stg-n').innerText = cur + 1;
    document.getElementById('stg-guide').innerText = s.t;

    if(s.type === "silver_hard") {
        for(let i=0; i<s.n; i++){
            const y = document.createElement('div'); y.style="position:absolute;background:#ffff00;border-radius:50%;width:18px;height:18px;border:1px solid #ccaa00;";
            y.style.left = Math.random()*96+"%"; y.style.top = Math.random()*96+"%"; f.appendChild(y);
        }
        for(let j=0; j<5; j++){
            const g = document.createElement('div'); g.style="position:absolute;background:rgba(136,136,136,0.3);border-radius:50%;width:14px;height:14px;border:1px solid rgba(51,51,51,0.3);cursor:pointer;z-index:100;";
            g.style.left = Math.random()*92+"%"; g.style.top = Math.random()*92+"%";
            g.onclick = () => { if(!active)return; g.style.visibility="hidden"; found++; if(found>=5) nextStage(); };
            f.appendChild(g);
        }
    } else if(s.type === "choice") {
        const bL = document.createElement('div'); bL.style = "position:absolute; left:10%; top:30%; width:130px; height:130px; border-radius:50%; background:red; border:4px solid white;";
        const bR = bL.cloneNode(); bR.style.left = "55%"; bR.style.background = "blue";
        let target = "red";
        bL.onclick = () => target === "red" ? nextStage() : location.reload();
        bR.onclick = () => target === "blue" ? nextStage() : location.reload();
        f.appendChild(bL); f.appendChild(bR);
        choiceInterval = setInterval(() => { target = Math.random()>0.5?"red":"blue"; bL.style.opacity=target==="red"?"1":"0.1"; bR.style.opacity=target==="blue"?"1":"0.1"; }, 600);
    } else if(s.type === "spiral") {
        const w = window.innerWidth, h = window.innerHeight-60;
        const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
        svg.setAttribute("width",w); svg.setAttribute("height",h);
        const g = document.createElementNS("http://www.w3.org/2000/svg","g");
        g.setAttribute("fill","none"); g.setAttribute("stroke","#000"); g.setAttribute("stroke-width","1.2");
        svg.appendChild(g); f.appendChild(svg);
        const gList = []; while(gList.length<5) gList.push(Math.floor(Math.random()*160000)+10000);
        for(let i=0; i<180000; i+=10){
            let a = 0.05*i, r = 0.003*i;
            let x = (w/2)+r*Math.cos(a*Math.PI/180), y = (h/2)+r*Math.sin(a*Math.PI/180);
            if(gList.some(gap => i >= gap && i < gap+130)){
                const hCircle = document.createElement('div');
                hCircle.style = `position:absolute; left:${x}px; top:${y}px; width:44px; height:44px; margin:-22px; cursor:pointer;`;
                hCircle.onclick = () => { hCircle.style.background="rgba(255,0,0,0.6)"; found++; if(found>=5) nextStage(); };
                f.appendChild(hCircle);
            }
        }
    } else {
        // 背景生成
        for(let i=0; i<s.n; i++){
            const m = document.createElement('span'); m.className = 'miss-item' + (s.type==="moving_bg"?" moving-bg":"");
            if(s.type === "cat_trap") m.classList.add('force-yellow'); // 2番背景イエロー化
            m.style.left=Math.random()*95+"%"; m.style.top=Math.random()*95+"%";
            m.innerText = (cur === 8) ? "⭐" : s.c[Math.floor(Math.random()*s.c.length)];
            f.appendChild(m);
        }
        // 正解生成
        const gls = s.goals || 1;
        for(let j=0; j<gls; j++){
            const t = document.createElement('div');
            if(s.type === "penta_task") { t.className = "pentagon-filled-tiny"; }
            else {
                t.className = 'target-item';
                if(s.type === "cat_trap") t.classList.add('force-yellow'); // 2番正解イエロー化
                if(s.type === "ufo_trap") t.style.opacity = "0.25";
                if(s.type === "tiny_cookie") t.style.fontSize = "16px";
                if(s.type === "tiny_clown") t.style.fontSize = "10px";
                if(s.type === "tiny_bug") t.style.fontSize = "14px";
                t.innerText = Array.isArray(s.g)?s.g[j]:s.g;
            }
            t.style.left=(Math.random()*85+5)+"%"; t.style.top=(Math.random()*80+10)+"%";
            if(s.type==="mirror_distinct") t.style.transform="scaleX(-1)";
            t.onmousedown = t.ontouchstart = (e) => { e.preventDefault(); e.stopPropagation(); if(!active)return; t.style.visibility="hidden"; found++; if(found>=gls) nextStage(); };
            f.appendChild(t);
        }
    }
}

function nextStage() { active=false; if(choiceInterval)clearInterval(choiceInterval); confetti(); cur++; setTimeout(()=>{ if(cur<stages.length)init(); else {alert("ALL CLEAR!"); location.reload();} }, 600); }

setInterval(() => {
    if(!active) return;
    ms--; const t = document.getElementById('timer'); t.innerText = (ms/100).toFixed(2);
    if(ms <= 1000) { t.classList.add('timer-danger'); if(ms % 100 === 0) playBeep(880, 0.05); }
    else { t.classList.remove('timer-danger'); }
    if(ms <= 0) { active = false; playBeep(220, 0.5); alert("TIME UP!"); location.reload(); }
}, 10);
</script>
</body>
</html>
