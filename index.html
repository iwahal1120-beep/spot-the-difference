<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Search Challenge GIGA-HARD Final</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { text-align:center; font-family: sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; }
        
        /* 完璧なバイリンガル・プレミアムトップページ */
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000, #1a1a1a); z-index:30000; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .premium-box { border: 4px solid #ffd700; padding: 15px; border-radius: 15px; background: rgba(255,215,0,0.15); margin: 10px 0; width: 100%; max-width: 360px; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .ranking-box { width: 100%; max-width: 360px; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; margin: 10px 0; font-size: 14px; box-sizing: border-box; border: 1px solid rgba(255,215,0,0.3); }
        .ranking-title { color: #ffd700; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #ffd700; }
        .btn-ofuse-top { background: #ed6c00; color: white; padding: 16px; border-radius: 12px; text-decoration: none; font-size: 18px; font-weight: bold; display: block; margin-bottom: 10px; width: 100%; text-align: center; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(237,108,0,0.4); }
        
        /* ターゲットは必ず最前面（自転車重なり防止） */
        .target-item { z-index: 28000 !important; } 

        /* 【究極修正】金貨：CSSで強制的に鮮明なイエローを出す */
        .gold-coin { 
            background-color: #FFFF00 !important; /* 絶対的な黄色 */
            background-image: radial-gradient(circle, #FFFFFF 0%, #FFFF00 70%, #FFD700 100%) !important;
            box-shadow: 0 0 12px rgba(255,255,0,1);
            border: 2px solid #FFCC00;
            color: transparent !important;
        }
        .silver-coin { 
            background-color: #E0E0E0 !important;
            background-image: radial-gradient(circle, #FFFFFF 0%, #C0C0C0 60%, #708090 100%) !important;
            box-shadow: 0 0 12px rgba(255,255,255,1);
            border: 2px solid #A9A9A9;
            color: transparent !important;
        }

        .header { background: #d44d5c; color: white; height: 110px; padding: 5px; position: relative; z-index: 10001; }
        #timer { color: #fff; background: #000; padding: 2px 8px; border-radius: 5px; font-family: monospace; font-size: 24px; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; font-size: 24px; border-radius: 50%; }

        .btn { width:100%; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:20px; font-weight:bold; box-shadow: 0 6px 0 #8a2a35; cursor:pointer; margin-top:10px; }
        input { padding:14px; font-size:16px; width:100%; margin-bottom:12px; border-radius:8px; border:none; box-sizing:border-box; }
    </style>
</head>
<body onload="loadRanking()">

<div id="start-screen">
    <h2 style="color:#ffd700; margin-bottom:5px;">Search Challenge GIGA-HARD</h2>
    
    <div class="premium-box">
        <div style="font-size:18px; font-weight:bold; color:#ffd700;">
            2026年12月31日 0:00(JST) 締切！<br>
            1位に10万円ギフトカード贈呈
        </div>
        <div style="font-size:13px; color:#fff; margin-top:5px; opacity:0.9;">
            Deadline: Dec 31, 2026. Top Scorer wins 100,000 JPY!
        </div>
    </div>

    <div class="ranking-box">
        <div class="ranking-title">🏆 CURRENT TOP RECORDS</div>
        <div id="rank-list" style="font-family: monospace; font-size:14px;">No records yet</div>
    </div>

    <div style="width: 100%; max-width: 360px;">
        <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn-ofuse-top">
            応援して10万円に挑戦！🚀<br>
            <span style="font-size:12px; font-weight:normal;">Support & Start Challenge!</span>
        </a>
    </div>

    <div style="width: 100%; max-width: 320px; background: rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; margin-top:5px;">
        <input type="text" id="p-name" placeholder="Nickname / ニックネーム">
        <input type="password" id="p-pass" placeholder="4-digit Pass / パスワード">
        <button onclick="startGame()" class="btn">START / 挑戦する 🏆</button>
    </div>
</div>

<div class="header">
    <div id="stg-desc" style="font-weight:bold; font-size:18px;">Ready...</div>
    <div>Time: <span id="timer">30.00</span> | Stage: <span id="stg-n">1</span>/25</div>
</div>
<div class="game-area" id="field"></div>

<script>
let cur = 0, ms = 3000, tid = null, active = false, found = 0, score = 0, pName, pPass;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, type, dur) {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function loadRanking() {
    const records = JSON.parse(localStorage.getItem('gigaHard_ranks') || '[]');
    const rList = document.getElementById('rank-list');
    if(records.length === 0) { rList.innerText = "No records yet."; return; }
    rList.innerHTML = records.map((r,i)=>`<div>${i+1}. ${r.name.slice(0,10)}: ${r.score.toFixed(2)}s</div>`).join('');
}

function updateRanking(newName, newScore) {
    let records = JSON.parse(localStorage.getItem('gigaHard_ranks') || '[]');
    records.push({name: newName, score: newScore});
    records.sort((a, b) => b.score - a.score);
    localStorage.setItem('gigaHard_ranks', JSON.stringify(records.slice(0, 3)));
    loadRanking();
}

const stages = [
    { t: "1. Find Human! / 人間を探せ", c: ["🐶","🐱","🐭","🐹","🐰"], g: "🙋‍♂️", n: 700 },
    { t: "2. Find Cat! / 猫を探せ", c: ["🧔","👵","👦","👧"], g: "🐱", n: 900 }, // 200増量
    { t: "3. Find Bicycle! / 自転車を探せ", c: ["🚗","🚕","🚙","🚌"], g: "🚲", n: 870 }, // 200増量
    { t: "4. Find Cookie! / クッキーを探せ", c: ["🍬","🍭","🍫","🍩"], g: "🍪", n: 700 },
    { t: "5. YELLOW vs SILVER! / 黄色い金貨の中の銀貨", c: ["●"], g: "●", n: 820, goals: 5, type: "silver" },
    { t: "6. Find Clown! / ピエロを探せ", c: ["👩‍🦰","👱‍♀️","💃"], g: "🤡", n: 700 },
    { t: "7. Find 5 Flags! / 国旗を5つ", c: ["🌍","🌎","🌏"], g: "FLAGS", n: 700, goals: 5 },
    { t: "8. Find Bone! / 骨を探せ", c: ["🐟","🐠"], g: "🦴", n: 760 },
    { t: "9. Find Umeboshi! / 梅干しを探せ", c: ["🪐","⭐","🌌"], g: "🔴", n: 760 },
    { t: "10. 5 Mirror 'あ' / 反転あ×5", c: ["あ"], g: "あ", n: 580, goals: 5, type: "mirror" },
    { t: "11. Find Torii! / 鳥居を探せ", c: ["🏢","🏣"], g: "⛩", n: 700 },
    { t: "12. Find Cherries! / さくらんぼ", c: ["🍎"], g: "🍒", n: 760 },
    { t: "13. Find Bug! / 虫を探せ", c: ["🍃","🌱"], g: "🐛", n: 700 },
    { t: "14. Find Trophy! / トロフィー", c: ["⚽","🏀"], g: "🏆", n: 700 },
    { t: "15. Find Banana! / バナナを探せ", c: ["🌙"], g: "🍌", n: 760 },
    { t: "16. 5 Different Animals! / 動物5匹", c: ["🐼"], g: "DIFF_5", n: 580, goals: 5 },
    { t: "17. Find Octopus! / タコを探せ", c: ["🦑"], g: "🐙", n: 760 },
    { t: "18. Faint UFO! / 薄いUFO", c: ["✨","🌟"], g: "🛸", n: 820, type: "ufo" },
    { t: "19. 5 Ice Creams! / ソフト5個", c: ["🍭"], g: "🍦", n: 580, goals: 5 },
    { t: "20. 5 Brown Eyes! / 茶色の目5つ", c: ["👁️"], g: "👁️", n: 580, goals: 5, type: "eye" },
    { t: "21. Find 5 Ladies! / 女性を5人", c: ["🧔"], g: "💃", n: 700, goals: 5 },
    { t: "22. 5 Still Boxes! / 静止箱5つ", c: ["■"], g: "■", n: 520, goals: 5, type: "shake" },
    { t: "23. 5 Chicks! / ヒヨコ5匹", c: ["🐓"], g: "🐥", n: 580, goals: 5 },
    { t: "24. Luck! Red or Blue? / 運命の二択", g: "CHOICE" },
    { t: "25. 5 Gaps in Spiral / 渦の切れ目5", g: "SPIRAL" },
    { t: "FINAL", g: "FINAL" }
];

function startGame() {
    pName = document.getElementById('p-name').value.trim();
    pPass = document.getElementById('p-pass').value.trim();
    if(!pName || pPass.length<4) return alert("Nickname & 4-digit Pass required");
    if(audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('start-screen').style.display='none'; 
    cur = 0; score = 0; init();
}

function init() {
    const f = document.getElementById('field'); f.innerHTML = "";
    found = 0; active = true; ms = 3000;
    const s = stages[cur];
    if(!s || s.g === "FINAL") return end();
    document.getElementById('stg-desc').innerText = s.t;
    document.getElementById('stg-n').innerText = cur + 1;
    if(s.g === "CHOICE") createChoiceStage(f);
    else if(s.g === "SPIRAL") createSpiralStage(f);
    else createNormalStage(f, s);
    if(!tid) tid = setInterval(updateTimer, 10);
}

function createNormalStage(f, s) {
    for(let i=0; i<s.n; i++) createItem(f, s.c[Math.floor(Math.random()*s.c.length)], false, s.type);
    const goalNum = s.goals || 1;
    if(s.g === "FLAGS") {
        ["🇯🇵", "🇺🇸", "🇨🇳", "🇷🇺", "🇰🇵"].forEach((flag) => createItem(f, flag, true));
    } else {
        for(let j=0; j<goalNum; j++) createItem(f, s.g, true, s.type, j);
    }
}

function createItem(f, type, isT, st, idx) {
    const el = document.createElement('span'); el.className = isT ? 'item target-item' : 'item';
    el.style.left = (2+Math.random()*92) + "%"; el.style.top = (2+Math.random()*92) + "%";
    if(!isT) {
        el.style.zIndex = Math.floor(Math.random()*20000);
        if(st === "silver") { el.classList.add("gold-coin"); }
        else el.innerText = type;
    } else {
        if(st === "silver") { el.classList.add("silver-coin"); }
        else if(st === "mirror") { el.innerText = "あ"; el.style.transform = "scaleX(-1)"; }
        else if(st === "ufo") { el.innerText = "🛸"; el.style.opacity = "0.2"; }
        else if(type === "DIFF_5") el.innerText = ["🐶","🐱","🐭","🐹","🐰"][idx];
        else el.innerText = type;
    }
    el.onclick = () => {
        if(!active) return;
        if(isT) {
            if(el.style.opacity === "0.4") return;
            found++; score += ms/100; el.style.opacity = "0.4";
            playSound(880, 'sine', 0.1); if(found >= (stages[cur].goals || 1)) nextStage();
        } else { active = false; clearInterval(tid); tid = null; document.getElementById('start-screen').style.display='flex'; }
    };
    f.appendChild(el);
}

function createChoiceStage(f) {
    const isRed = Math.random() < 0.5;
    const r = document.createElement('div'); r.style.cssText="position:absolute;width:100px;height:100px;border-radius:50%;background:#ff0000;left:20%;top:40%;z-index:30000;cursor:pointer;";
    const b = document.createElement('div'); b.style.cssText="position:absolute;width:100px;height:100px;border-radius:50%;background:#0000ff;left:60%;top:40%;z-index:30000;cursor:pointer;";
    r.onclick = () => isRed ? nextStage() : location.reload();
    b.onclick = () => !isRed ? nextStage() : location.reload();
    f.appendChild(r); f.appendChild(b);
}

function createSpiralStage(f) {
    const canvas = document.createElement('canvas'); canvas.width = f.offsetWidth; canvas.height = f.offsetHeight; f.appendChild(canvas);
    const ctx = canvas.getContext('2d'); const cx = canvas.width/2, cy = canvas.height/2;
    ctx.beginPath(); for(let i=0; i<360*400; i++){ let a=i*Math.PI/180, r=a*0.08; ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); } ctx.stroke();
    for(let j=0; j<5; j++){
        let d = document.createElement('div'); d.style.cssText=`position:absolute;width:25px;height:25px;left:${Math.random()*90}%;top:${Math.random()*90}%;z-index:30000;cursor:pointer;`;
        d.onclick=()=>{ d.style.background="rgba(212,77,92,0.5)"; found++; if(found>=5) nextStage(); }; f.appendChild(d);
    }
}

function nextStage() { active = false; confetti({particleCount:100}); setTimeout(()=>{cur++; init();}, 600); }

function updateTimer() {
    if(!active) return; ms--; const t = document.getElementById('timer');
    if(ms <= 0) { location.reload(); return; }
    t.innerText = (ms/100).toFixed(2);
    if(ms <= 1000) t.style.color = "red"; else t.style.color = "white";
}

function end() {
    active = false; clearInterval(tid); updateRanking(pName, score);
    document.getElementById('field').innerHTML = `
        <div style="padding:20px;">
            <h2 style="color:#d44d5c;">ALL STAGES CLEARED!<br>完全制覇おめでとう！</h2>
            <p style="font-size:24px; font-weight:bold;">Final Score: ${score.toFixed(2)}s</p>
            <div class="premium-box" style="background:white; color:#333; margin:20px auto;">
                <p>10万円に届くかな？応援もよろしくお願いします！</p>
                <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn">OFUSEで応援する</a>
            </div>
            <button onclick="location.reload()" class="btn">TOPに戻る / Return to Top</button>
        </div>`;
}
</script>
</body>
</html>
