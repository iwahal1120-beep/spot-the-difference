<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Search Challenge GIGA-HARD</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { text-align:center; font-family: sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; }
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000, #1a1a1a); z-index:30000; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .premium-box { border: 4px solid #ffd700; padding: 15px; border-radius: 15px; background: rgba(255,215,0,0.15); margin: 10px 0; width: 100%; max-width: 340px; }
        .target-rule { color: #333; font-size: 13px; background: white; padding: 15px; border-radius: 10px; margin: 10px 0; line-height: 1.6; text-align: left; border-left: 5px solid #ffd700; width: 95%; box-sizing: border-box; }
        .input-group { width: 100%; max-width: 320px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; }
        input { padding:12px; font-size:16px; width:100%; margin-bottom:10px; border-radius:8px; border:none; box-sizing:border-box; }
        .header { background: #d44d5c; color: white; height: 110px; padding: 5px; }
        #timer { color: #fff; background: #000; padding: 2px 8px; border-radius: 5px; font-family: monospace; font-size: 24px; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; font-size: 24px; }
        .mirror { transform: scaleX(-1); }
        .umeboshi { text-shadow: 1px 1px 2px #800, -1px -1px 0px #f66; color: #d00; font-weight: bold; border: 1px dashed #a00; border-radius: 50%; padding: 2px; }
        @keyframes glitch { 0%{transform:translate(0)} 20%{transform:translate(-2px,2px)} 40%{transform:translate(-2px,-2px)} 60%{transform:translate(2px,2px)} 80%{transform:translate(2px,-2px)} 100%{transform:translate(0)} }
        .shaking { animation: glitch 0.15s infinite; background: #007bff; border-radius: 4px; }
        .break-point { width: 10px; height: 10px; background: white; border-radius: 50%; z-index: 10000; cursor: pointer; border: 1px solid #000; }
        .btn { width:100%; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:20px; font-weight:bold; box-shadow: 0 6px 0 #8a2a35; }
        .btn-ofuse-top { background: #ed6c00; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
<audio id="s-ping" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
<audio id="s-warn" src="https://assets.mixkit.co/active_storage/sfx/495/495-preview.mp3" preload="auto"></audio>

<div id="start-screen">
    <h2 style="color:#ffd700;">Search Challenge!</h2>
    <div class="premium-box">
        <div style="font-size:24px; font-weight:bold; color:#ffd700;">10万円分ギフト券</div>
    </div>
    <div style="width: 100%; max-width: 340px; margin-bottom: 10px;">
        <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn-ofuse-top">活動を応援して10万円に挑戦！🚀</a>
    </div>
    <div class="target-rule">
        【参加規約】<br>
        ・本ゲームはどなたでも無料で挑戦可能です。<br>
        ・1位入賞時の本人確認に<span style="color:red;font-weight:bold;">パスワード</span>を使用します。<br>
        ・<span style="color:red;font-weight:bold;">OFUSEはゲームのパスワードと同じものを使用し、本人確認を行います。</span>
    </div>
    <div class="input-group">
        <input type="text" id="p-name" placeholder="名前 (10文字以内)">
        <input type="password" id="p-pass" placeholder="パスワード (数字4桁)">
        <button onclick="startGame()" class="btn">挑戦を開始する！🏆</button>
    </div>
</div>

<div class="header">
    <div id="stg-desc" style="font-weight:bold;">Ready...</div>
    <div>残り: <span id="timer">30.00</span> | Stage: <span id="stg-n">1</span>/25</div>
</div>
<div class="game-area" id="field"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzvFsfk4Zp48AyJgQccCOQMX911-Itey8Sc8VH9ehnSF7J7PDpkPNayzijuO5BOBEQKaw/exec";
let cur = 0, ms = 3000, tid = null, active = false, found = 0, score = 0, pName, pPass;

const animals = ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐒"];

// 20番：閉じた目（リアルな線描画）のHTML
const CLOSED_EYE = `<svg viewBox="0 0 100 100" width="24" height="24"><path d="M10,50 Q50,90 90,50" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/></svg>`;

const stages = [
    { t: "1. 動物から人間！", c: ["🐶","🐱","🐭","🐹","🐰"], g: "🙋‍♂️", n: 1000 },
    { t: "8. 魚から開きの身！", c: ["🐟"], g: "🍣", n: 1400 },
    { t: "9. 星からしわしわ梅干し！", c: ["✨","⭐"], g: "🔴", n: 1600, special: "umeboshi" },
    { t: "10. 「あ」を5個！", c: ["あ"], g: "MIRROR_A", n: 350, goals: 5 },
    { t: "16. 全員違う動物を5匹！", c: ["🐼"], g: "DIFF_5", n: 500, goals: 5 },
    { t: "20. 閉じている目400個から開いた目5つ", c: ["CLOSED_EYE"], g: "👁️", n: 400, goals: 5, special: "real_eye" },
    { t: "22. 【電脳】震えるブロック5つ", c: ["　"], g: "SHAKE", n: 1, goals: 5 },
    { t: "23. ヒヨコを5匹！", c: ["🥚"], g: "CHICK", n: 300, goals: 5 },
    { t: "25. 70周の黒線からキレている5箇所", c: ["渦"], g: "SPIRAL_BREAK", n: 1, goals: 5 },
    { t: "FINAL", g: "FINAL" }
];

function startGame() {
    pName = document.getElementById('p-name').value; pPass = document.getElementById('p-pass').value;
    if(!pName || pPass.length<4) return alert("名前とパスワードを入力してください");
    document.getElementById('start-screen').style.display='none'; init();
}

function init() {
    const f = document.getElementById('field'); f.innerHTML = "";
    found = 0; active = true; ms = 3000;
    const s = stages[cur < stages.length ? cur : stages.length-1];
    if(s.g === "FINAL") return end();
    
    document.getElementById('stg-desc').innerText = s.t;
    document.getElementById('stg-n').innerText = cur + 1;
    document.getElementById('timer').style.color = "white";

    const mt = s.goals || 1;
    
    if(s.g === "SPIRAL_BREAK") {
        const bg = document.createElement('div');
        bg.style.cssText = "position:absolute;width:100%;height:100%;background:repeating-radial-gradient(circle, #000, #000 0.5px, transparent 0.5px, transparent 3px);";
        f.appendChild(bg);
        for(let j=0; j<5; j++) createItem(f, "BREAK", true);
    } else {
        for(let j=0; j<mt; j++) createItem(f, s.g, true, j, s.special);
        for(let i=0; i<s.n; i++) {
            const crowdType = (s.c[0] === "CLOSED_EYE") ? "CLOSED_EYE" : s.c[Math.floor(Math.random()*s.c.length)];
            createItem(f, crowdType, false);
        }
    }

    if(!tid) tid = setInterval(updateTimer, 10);
}

function createItem(f, type, isT, idx=0, special="") {
    const el = document.createElement('span');
    el.className = 'item';
    if(type === "CLOSED_EYE") {
        el.innerHTML = CLOSED_EYE;
    } else if(isT) {
        el.style.zIndex = 1000;
        if(type === "MIRROR_A") { el.innerText = "あ"; el.classList.add('mirror'); }
        else if(type === "DIFF_5") { el.innerText = animals[idx % animals.length]; }
        else if(type === "SHAKE") { el.classList.add('shaking'); el.innerText = " "; el.style.width="32px"; el.style.height="32px"; }
        else if(type === "BREAK") { el.className = 'item break-point'; }
        else { 
            el.innerText = type; 
            if(special === "umeboshi") el.classList.add('umeboshi');
        }
        
        el.onclick = () => {
            if(!active || el.style.opacity === "0") return;
            document.getElementById('s-ping').currentTime = 0; document.getElementById('s-ping').play().catch(()=>{});
            el.style.opacity = 0; found++; score += ms/100;
            if(found >= (stages[cur].goals || 1)) {
                active = false; confetti(); setTimeout(()=>{cur++; init();}, 600);
            }
        };
    } else { el.innerText = type; }
    
    el.style.left = Math.random()*92 + "%"; el.style.top = Math.random()*92 + "%";
    f.appendChild(el);
}

function updateTimer() {
    if(!active) return;
    ms--;
    const t = document.getElementById('timer');
    t.innerText = (ms/100).toFixed(2);
    if(ms === 1000) { document.getElementById('s-warn').play().catch(()=>{}); t.style.color = "red"; }
    if(ms <= 0) location.reload();
}

async function end() {
    active = false; clearInterval(tid);
    document.getElementById('field').innerHTML = "<h2>記録送信中...</h2>";
    try {
        await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({name:pName, score:score.toFixed(2), pass:pPass}) });
        location.reload();
    } catch(e) { location.reload(); }
}
</script>
</body>
</html>
