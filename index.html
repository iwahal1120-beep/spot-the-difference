<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>20円募金 - Search Challenge! Special</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { text-align:center; font-family: sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        .header { padding: 5px; background: #d44d5c; color: white; height: 110px; box-sizing: border-box; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
        .main-title { font-size: 16px; font-weight: bold; margin: 0; }
        .status-bar { display: flex; justify-content: center; gap: 20px; font-size: 16px; margin-top: 5px; font-weight: bold; }
        #stg-desc { font-size: 12px; background: white; color: #d44d5c; display: inline-block; padding: 2px 10px; border-radius: 15px; margin-top: 3px; width: 90%; }
        #timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; min-width: 65px; display: inline-block; font-variant-numeric: tabular-nums; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-size: 30px; }
        .target-item { z-index: 9999 !important; font-size: 34px !important; filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.8)); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; width: 85%; z-index: 20000; border: 5px solid #d4af37; border-radius: 15px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-weight: bold; border-radius: 8px; font-size: 18px; text-align: center; border: none; cursor: pointer; text-decoration: none; }
        .btn-ofuse { background: #ed6c00 !important; color: #fff !important; }
        .btn-retry { background: #666 !important; color: #fff !important; }
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:30000; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; color:white; overflow-y: auto; padding-top: 20px; }
        .ranking-box { width: 85%; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-top: 20px; font-size: 14px; }
        .ranking-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 5px 0; }
        .gold { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

<audio id="sound-success" src="成功音.mp3" preload="auto"></audio>

<div id="start-screen">
    <h2 style="color:#ffd700; margin-bottom:10px;">Search Challenge!</h2>
    <input type="text" id="player-name" placeholder="ニックネーム" maxlength="10" style="padding:12px; font-size:18px; border-radius:5px; border:none; width:70%; margin-bottom:15px; text-align:center;">
    <button onclick="startGame()" style="padding:15px 50px; background:#d44d5c; color:white; border:none; border-radius:10px; font-size:20px; font-weight:bold; cursor:pointer;">ゲーム開始！</button>
    
    <div class="ranking-box">
        <div style="font-weight:bold; color:#ffd700; margin-bottom:10px; border-bottom:2px solid #ffd700;">現在の全国TOP 10</div>
        <div id="top10-list">読み込み中...</div>
    </div>
</div>

<div class="header">
    <div class="main-title">20円募金 - Search Challenge!</div>
    <div id="stg-desc">Ready...</div>
    <div class="status-bar">
        <div>残り: <span id="timer">30.00</span></div>
        <div>ステージ: <span id="stage-num">1</span>/20</div>
    </div>
</div>

<div id="game-field" class="game-area"></div>

<div id="modal" class="modal">
    <h2 id="modal-title">タイムアップ！</h2>
    <button onclick="window.location.reload();" class="btn btn-retry">最初から遊ぶ</button>
</div>

<script>
const OFUSE_URL = "https://ofuse.me/d33e72b9";
const GAS_URL = "https://script.google.com/macros/s/AKfycbzvFsfk4Zp48AyJgQccCOQMX911-Itey8Sc8VH9ehnSF7J7PDpkPNayzijuO5BOBEQKaw/exec"; 

let currentStage = 0, msLeft = 3000, timerId = null, gameActive = false, foundCount = 0;
let totalTimeScore = 0, playerName = "名無しさん";

const field = document.getElementById('game-field');
const timerDisp = document.getElementById('timer');
const successSound = document.getElementById('sound-success');

const stages = [
    { title: "1. 動物から「人間」を探せ！", crowd: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯"], target: "🙋‍♂️", num: 400, goals: 1 },
    { title: "2. 人間から「猫」を探せ！", crowd: ["🧔","👵","👦","👧","👩‍🦰","👱‍♂️","👳‍♀️"], target: "🐱", num: 400, goals: 1 },
    { title: "3. 渋滞の中から「自転車」を探せ！", crowd: ["🚗","🚕","🚙","🚌","🏎","🚓"], target: "🚲", num: 400, goals: 1 },
    { title: "4. お菓子から「クッキー」を探せ！", crowd: ["🍬","🍭","🍫","🍩","🍮","🍰"], target: "🍪", num: 400, goals: 1 },
    { title: "5. 黄色のドル金貨から銀貨を1枚探せ！", crowd: ["💰"], target: "🔘", num: 500, goals: 1 },
    { title: "6. 400人の女性から「ピエロ」を一人！", crowd: ["👩","👩‍🦰","👱‍♀️","👩‍🦳","👩‍🦱","💃"], target: "🤡", num: 400, goals: 1 },
    { title: "7. 国旗（日・米・中・露・北）を全部探せ！", crowd: ["🌍","🌎","🌏","🧔","👧"], target: "FLAGS", num: 400, goals: 5 },
    { title: "8. 魚の中に「魚の骨」！重なっていても見つけろ！", crowd: ["🐟","🐠","🐡","🦈"], target: "🦴", num: 450, goals: 1 },
    { title: "9. 500個の星から「梅干し」を！", crowd: ["✨","⭐","🌟"], target: "🔴", num: 500, goals: 1 },
    { title: "10. 【石を探せ】「右」の海から「石」を救出せよ！", crowd: ["右"], target: "石", num: 350, goals: 1 },
    { title: "11. 都会のビル群から「鳥居」を探せ！", crowd: ["🏢","🏣","🏥","🏦","🏨"], target: "⛩", num: 400, goals: 1 },
    { title: "12. リンゴから「サクランボ」！", crowd: ["🍎"], target: "🍒", num: 400, goals: 1 },
    { title: "13. 400枚の葉から「イモムシ」を！", crowd: ["🍃","🌿","🌱"], target: "🐛", num: 400, goals: 1 },
    { title: "14. スポーツの祭典から「優勝カップ」！", crowd: ["⚽","🏀","🏈","⚾","🎾","🏐"], target: "🏆", num: 400, goals: 1 },
    { title: "15. 「月」の中にひとつだけ「バナナ」！", crowd: ["🌙"], target: "🍌", num: 450, goals: 1 },
    { title: "16. 難問！「白」の中にひとつだけ「臼」！", crowd: ["白"], target: "臼", num: 400, goals: 1 },
    { title: "17. 海の中…「イカ」から「タコ」！", crowd: ["🦑"], target: "🐙", num: 400, goals: 1 },
    { title: "18. 星空のどこかに「UFO」が…！", crowd: ["✨","⭐","🌟"], target: "🛸", num: 500, goals: 1 },
    { title: "19. 大変！「💩」の中に「ソフトクリーム」！", crowd: ["💩"], target: "🍦", num: 400, goals: 1 },
    { title: "20. 最終：全クリ！20円募金のお願い", crowd: [], target: "FINAL", num: 0, goals: 1 }
];

window.onload = async () => {
    try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        const list = document.getElementById('top10-list');
        list.innerHTML = data.map((entry, i) => `
            <div class="ranking-item ${i<3?'gold':''}">
                <span>${i+1}位 ${entry.name}</span>
                <span>${entry.score} pts</span>
            </div>
        `).join('');
    } catch(e) { document.getElementById('top10-list').innerText = "ランキング取得不可"; }
};

function startGame() {
    const input = document.getElementById('player-name').value;
    if(input) playerName = input;
    // ブラウザの音再生許可を得るために一度空再生
    successSound.play().then(() => { successSound.pause(); successSound.currentTime = 0; });
    document.getElementById('start-screen').style.display = 'none';
    initStage();
}

function initStage() {
    field.innerHTML = "";
    foundCount = 0;
    if (currentStage >= stages.length) return;
    const stage = stages[currentStage];
    document.getElementById('stg-desc').innerText = stage.title;
    document.getElementById('stage-num').innerText = currentStage + 1;
    msLeft = 3000;
    timerDisp.innerText = (msLeft / 100).toFixed(2);
    field.style.background = (currentStage === 8 || currentStage === 17) ? "#000" : "#fff";
    if (stage.target === "FINAL") { showFinalScreen(); return; }

    const usedPositions = [];
    gameActive = true;

    // 1. ターゲットを先に配置
    const targets = stage.target === "FLAGS" ? ["🇯🇵", "🇺🇸", "🇨🇳", "🇰🇵", "🇷🇺"] : [stage.target];
    targets.forEach(t => {
        const pos = getSafePos(usedPositions, true); // ターゲット周囲は広めに空ける
        createItem(t, true, pos);
        usedPositions.push(pos);
    });

    // 2. モブを配置
    for (let i = 0; i < stage.num; i++) {
        const char = stage.crowd[Math.floor(Math.random() * stage.crowd.length)];
        const pos = getSafePos(usedPositions, false); 
        createItem(char, false, pos);
        // パフォーマンスのため、モブ同士は重なりを許容するがターゲットには被せない
    }
    if(!timerId) startTimer();
}

function getSafePos(used, isTarget) {
    let x, y, safe = false;
    let attempts = 0;
    while (!safe && attempts < 100) {
        x = Math.random() * 90 + 2;
        y = Math.random() * 90 + 2;
        // 既存の（特にターゲットの）位置から一定距離離れているかチェック
        safe = used.every(p => Math.abs(p.x - x) > 6 || Math.abs(p.y - y) > 6);
        attempts++;
    }
    return {x, y};
}

function createItem(content, isTarget, pos) {
    const el = document.createElement('span');
    el.className = isTarget ? 'item target-item' : 'item';
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.style.zIndex = isTarget ? "9999" : Math.floor(Math.random() * 1000);
    if (content === "💰") el.style.color = "#FFD700";
    if (content === "🔴" && isTarget) el.style.color = "#b30000";
    el.innerText = content;

    el.onclick = function(e) {
        if(!gameActive) return;
        if (isTarget) {
            if (this.dataset.found === "true") return;
            this.dataset.found = "true";
            
            // ★音を鳴らす
            successSound.currentTime = 0;
            successSound.play();

            this.style.transform = "scale(2.5) rotate(360deg)";
            this.style.transition = "0.3s";
            totalTimeScore += (msLeft / 100);
            foundCount++;

            if (foundCount >= stages[currentStage].goals) {
                gameActive = false;
                // ステージクリアのプチ紙吹雪
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
                setTimeout(() => { currentStage++; initStage(); }, 800);
            }
        } else {
            this.style.opacity = "0.2";
        }
    };
    field.appendChild(el);
}

function startTimer() {
    timerId = setInterval(() => {
        if(gameActive) {
            msLeft--;
            timerDisp.innerText = (msLeft / 100).toFixed(2);
            if(msLeft <= 0) endGame();
        }
    }, 10);
}

async function showFinalScreen() {
    gameActive = false;
    clearInterval(timerId);
    
    // 全クリアの大紙吹雪
    var duration = 3 * 1000;
    var end = Date.now() + duration;
    (function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#ffd700'] });
      confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#ffd700'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    }());

    const finalScore = totalTimeScore.toFixed(2);
    field.innerHTML = `<h2>集計中...</h2>`;
    
    let rankInfo = "";
    try {
        const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({name: playerName, score: finalScore})
        });
        const res = await response.json();
        rankInfo = `全国 ${res.total} 人中 ${res.rank} 位！`;
    } catch(e) { rankInfo = "記録完了！"; }

    field.innerHTML = `
        <div style="padding:20px; overflow-y:auto; height:100%;">
            <h2 style="color:#ffd700; text-shadow: 1px 1px 2px #000;">GRAND CLEAR!</h2>
            <div style="font-size:22px; font-weight:bold; color:#d44d5c; margin:10px 0;">${rankInfo}</div>
            <p>Score: ${finalScore} pts</p>
            <div style="background:#fff; border:3px solid #d44d5c; border-radius:15px; padding:20px; margin-bottom:20px;">
                <p><b>クリエイター支援のお願い</b></p>
                <p style="font-size:12px;">楽しんでいただけたら、20円からの応援をいただけると非常に励みになります！</p>
                <a href="${OFUSE_URL}" target="_blank" class="btn btn-ofuse">OFUSEで応援を送る</a>
            </div>
            <button onclick="window.location.reload();" class="btn btn-retry">再挑戦！</button>
        </div>`;
}

function endGame() {
    gameActive = false;
    clearInterval(timerId);
    document.getElementById('modal').style.display = 'block';
}
</script>
</body>
</html>
