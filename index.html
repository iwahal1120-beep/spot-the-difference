<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>10万円争奪：Search Challenge GIGA-HARD</title>
<script src=""></script>
<style>
* { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
body { text-align:center; font-family: sans-serif; background-color: #f0f2f5; color: #333; margin: 0; overflow: hidden; }
#start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000, #1a1a1a); z-index:30000; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; box-sizing: border-box; overflow-y: auto; }
.premium-box { border: 4px solid #ffd700; padding: 15px; border-radius: 15px; background: rgba(255, 215, 0, 0.15); margin: 10px 0; width: 100%; max-width: 340px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
.gift-title { color: #ffd700; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
.input-group { width: 100%; max-width: 320px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; }
input { padding:12px; font-size:16px; border-radius:8px; width:100%; text-align:center; margin-bottom:10px; border:none; box-sizing:border-box; }
.header { padding: 5px; background: #d44d5c; color: white; height: 110px; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
#timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; min-width: 65px; display: inline-block; }
.game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
.item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; font-size: 18px; }
.target-item { z-index: 9999 !important; }
.btn { width:100%; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:20px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<audio id="sound-ping" src="" preload="auto"></audio>

<div id="start-screen">
<h2 style="color:#ffd700;">Search Challenge!</h2>
<div class="premium-box">
<div class="gift-title">10万円分ギフト券</div>
</div>
<div class="input-group">
<input type="text" id="player-name" placeholder="ニックネーム" maxlength="10">
<input type="password" id="player-pass" placeholder="パスワード(4桁)" maxlength="4" inputmode="numeric">
<button onclick="startGame()" class="btn">挑戦を開始する！🏆</button>
</div>
<div id="top10-list" style="margin-top:15px; font-size:13px; color: gold;">ランキング取得中...</div>
</div>

<div class="header">
<div id="stg-desc">Ready...</div>
<div>残り: <span id="timer">30.00</span> / ステージ: <span id="stage-num">1</span>/25</div>
</div>

<div class="game-area" id="game-bg"><div id="inner-field" style="width:100%; height:100%; position:relative;"></div></div>

<script>
const GAS_URL = "";
let currentStage = 0, msLeft = 3000, timerId = null, gameActive = false, foundCount = 0, totalTimeScore = 0, playerName = "", playerPass = "", playableStages = [];

const allStages = [
{ title: "1. 動物から人間！", crowd: ["🐶","🐱","🐭","🐹"], target: "🙋‍♂️", num: 1000 },
{ title: "2. 国旗（5つ）！", crowd: ["🌍","🌎","🌏"], target: "FLAGS", num: 1000, goals: 5 },
{ title: "3. 💩の中からアイス！", crowd: ["💩"], target: "🍦", num: 1200 },
{ title: "FINAL", target: "FINAL" }
];

window.onload = async () => {
try {
const res = await fetch(GAS_URL);
const data = await res.json();
document.getElementById('top10-list').innerHTML = data.slice(0, 5).map((e, i) => &lt;div&gt;${i+1}. ${e.name} ${e.score}s&lt;/div&gt;).join('');
} catch(e) {}
};

function startGame() {
playerName = document.getElementById('player-name').value.trim();
playerPass = document.getElementById('player-pass').value.trim();
if (!playerName || playerPass.length < 4) return alert("名前と4桁パスを入力してください");
playableStages = allStages;
document.getElementById('start-screen').style.display = 'none';
initStage();
}

function initStage() {
const field = document.getElementById('inner-field');
field.innerHTML = ""; foundCount = 0; gameActive = true; msLeft = 3000;
const stage = playableStages[currentStage];
if (stage.target === "FINAL") return showFinalScreen();
document.getElementById('stg-desc').innerText = stage.title;
document.getElementById('stage-num').innerText = currentStage + 1;

}

function createItem(txt, isT, stg) {
const el = document.createElement('span'); el.className = 'item';
if (isT) { el.classList.add('target-item'); el.onclick = (e) => { e.stopPropagation(); handleFound(el); }; }
el.style.left = Math.random()*95 + "%"; el.style.top = Math.random()*95 + "%";
el.innerText = txt; document.getElementById('inner-field').appendChild(el);
}

function handleFound(el) {
if(!gameActive || el.dataset.clicked) return;
el.dataset.clicked = "true"; document.getElementById('sound-ping').currentTime = 0; document.getElementById('sound-ping').play().catch(()=>{});
el.style.opacity = "0.3"; totalTimeScore += (msLeft / 100); foundCount++;
if (foundCount >= (playableStages[currentStage].goals || 1)) {
gameActive = false; confetti({ particleCount: 100 });
setTimeout(() => { currentStage++; initStage(); }, 600);
}
}

function startTimer() {
timerId = setInterval(() => {
if(gameActive) {
msLeft--; document.getElementById('timer').innerText = (msLeft / 100).toFixed(2);
if(msLeft <= 0) { clearInterval(timerId); alert("TIME UP!"); location.reload(); }
}
}, 10);
}

async function showFinalScreen() {
gameActive = false; clearInterval(timerId);
document.getElementById('inner-field').innerHTML = "<h2>記録送信中...</h2>";
const body = new URLSearchParams({ name: playerName, score: totalTimeScore.toFixed(2), pass: playerPass });
try {
await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: body });
alert("送信完了！");
} catch(e) {}
location.reload();
}
</script>
