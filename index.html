<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>Search Challenge - PREMIER</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { text-align:center; font-family: sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; }
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000, #1a1a1a); z-index:30000; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; box-sizing: border-box; }
        .premium-box { border: 4px solid #ffd700; padding: 10px; border-radius: 15px; background: rgba(255,215,0,0.15); margin: 5px 0; width: 100%; max-width: 340px; }
        .target-rule { color: #333; font-size: 12px; background: white; padding: 12px; border-radius: 10px; margin: 8px 0; line-height: 1.5; text-align: left; border-left: 5px solid #ffd700; width: 95%; box-sizing: border-box; }
        input { padding:12px; font-size:16px; width:100%; margin-bottom:10px; border-radius:8px; border:none; box-sizing:border-box; }
        .header { background: #d44d5c; color: white; height: 110px; padding: 5px; position: relative; z-index: 10001; }
        #timer { color: #fff; background: #000; padding: 2px 8px; border-radius: 5px; font-family: monospace; font-size: 24px; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        
        /* 共通アイテムスタイル */
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        
        /* ターゲット：絶対最前面 & 発光エフェクト */
        .target-item { 
            z-index: 20000 !important; 
            filter: drop-shadow(0 0 8px gold);
        }

        /* 個別調整 */
        .target-silver { width: 32px !important; height: 32px !important; font-size: 24px !important; }
        .target-umeboshi { width: 34px !important; height: 34px !important; background: #ffc0cb; border-radius: 50%; padding: 3px; }
        .target-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .emoji-item { font-size: 28px; }

        /* ボタン類 */
        .btn { width:100%; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:20px; font-weight:bold; box-shadow: 0 6px 0 #8a2a35; cursor:pointer; }
        .btn-ofuse-top { background: #ed6c00; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="start-screen">
    <h2 style="color:#ffd700; margin: 10px 0;">Search Challenge!</h2>
    <div class="premium-box">
        <div style="font-size:18px; font-weight:bold; color:#ffd700;">10万円分ギフト券</div>
        <div style="font-size:11px; margin-top:5px;">応援(OFUSE)により寄付を目指します。</div>
    </div>
    <div style="width: 100%; max-width: 340px; margin: 10px 0;">
        <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn-ofuse-top">活動を応援して10万円に挑戦！🚀</a>
    </div>
    <div class="target-rule">
        【ルール】<br>
        ・金貨から<b>銀貨5枚</b>、宇宙から<b>ピンクの梅</b>を探せ！<br>
        ・ターゲットは常に最前面にあります。
    </div>
    <div style="width: 100%; max-width: 320px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px;">
        <input type="text" id="p-name" placeholder="名前">
        <input type="password" id="p-pass" placeholder="パスワード(4桁)">
        <button onclick="startGame()" class="btn">挑戦を開始！🏆</button>
    </div>
</div>

<div class="header">
    <div id="stg-desc" style="font-weight:bold; font-size:14px;">Ready...</div>
    <div>残り: <span id="timer">30.00</span> | Stage: <span id="stg-n">1</span>/10</div>
</div>
<div class="game-area" id="field"></div>

<script>
let cur = 0, ms = 3000, tid = null, active = false, found = 0, score = 0, pName, pPass;

const stages = [
    { t: "1. 動物から人間！", c: ["🐶","🐱","🐭","🐹","🐰"], g: "🙋‍♂️", n: 450 },
    { t: "2. 人間から猫！", c: ["🧔","👵","👦","👧"], g: "🐱", n: 450 },
    { t: "3. 渋滞から自転車！", c: ["🚗","🚕","🚙","🚌"], g: "🚲", n: 350 }, // 減量
    { t: "4. お菓子からクッキー！", c: ["🍬","🍭","🍫","🍩"], g: "🍪", n: 450 },
    { t: "5. 金貨から「銀貨5枚」！", c: ["🪙"], g: "🥈", n: 500, goals: 5, type: "silver" },
    { t: "6. 美女の中に…相撲力士！", c: ["👩‍🦰","👱‍♀️","💃"], g: "sumo.png", n: 450 },
    { t: "7. 国旗（日米中露北）！", c: ["🌍","🌎","🌏"], g: "FLAGS", n: 450, goals: 5 },
    { t: "8. 魚から魚の骨！", c: ["🐟","🐠"], g: "fishbone.png", n: 450 },
    { t: "9. 宇宙に「ピンクの梅干し」！", c: ["🪐","⭐","🌌"], g: "umeboshi.png", n: 450, type: "umeboshi" },
    { t: "FINAL: 1円募金のお願い", g: "FINAL" }
];

function startGame() {
    pName = document.getElementById('p-name').value.trim();
    pPass = document.getElementById('p-pass').value.trim();
    if(!pName || pPass.length<4) return alert("入力不備");
    document.getElementById('start-screen').style.display='none'; 
    cur = 0; init();
}

function init() {
    const f = document.getElementById('field'); f.innerHTML = "";
    found = 0; active = true; ms = 3000;
    const s = stages[cur];
    if(s.g === "FINAL") return end();
    
    document.getElementById('stg-desc').innerText = s.t;
    document.getElementById('stg-n').innerText = cur + 1;

    // 1. 群衆を生成
    for(let i=0; i<s.n; i++) {
        createItem(f, s.c[Math.floor(Math.random()*s.c.length)], false);
    }

    // 2. ターゲットを生成（最前面）
    if(s.g === "FLAGS") {
        ["🇯🇵", "🇺🇸", "🇨🇳", "🇷🇺", "🇰🇵"].forEach((flag, i) => {
            createItem(f, flag, true, 15 + (i * 18), 40); // 重ならない配置
        });
    } else if(s.type === "silver") {
        for(let j=0; j<5; j++) createItem("🥈", true, null, null, "silver");
    } else {
        createItem(f, s.g, true, null, null, s.type);
    }

    if(!tid) tid = setInterval(updateTimer, 10);
}

function createItem(f, type, isT, customX, customY, specialType) {
    const el = document.createElement('span');
    el.className = isT ? 'item target-item' : 'item';
    
    if (isT) {
        if (specialType === "silver" || type === "🥈") el.classList.add('target-silver');
        if (specialType === "umeboshi") el.classList.add('target-umeboshi');
        el.style.left = customX ? customX + "%" : (10 + Math.random()*80) + "%";
        el.style.top = customY ? customY + "%" : (10 + Math.random()*80) + "%";
    } else {
        el.style.zIndex = Math.floor(Math.random()*10000);
        el.style.left = (Math.random()*92) + "%";
        el.style.top = (Math.random()*92) + "%";
    }

    if(type.indexOf(".png") !== -1) {
        const img = document.createElement('img');
        img.className = 'target-img';
        img.src = type + "?v=" + Date.now();
        img.onerror = function() {
            this.style.display = "none";
            el.innerText = type === "sumo.png" ? "力士" : (type === "umeboshi.png" ? "梅" : "骨");
            el.style.background = "#fff"; el.style.border = "2px solid gold"; el.style.borderRadius = "5px";
            el.style.fontSize = "14px"; el.style.fontWeight = "bold";
        };
        el.appendChild(img);
    } else {
        el.innerText = type;
        el.classList.add('emoji-item');
    }

    el.onclick = (e) => {
        if(!active) return;
        if(isT) {
            if(el.style.opacity === "0.3") return;
            found++; score += ms/100;
            el.style.opacity = "0.3"; el.style.transform = "scale(2) rotate(360deg)"; el.style.transition = "0.3s";
            if(found >= (stages[cur].goals || 1)) nextStage();
        } else {
            el.style.opacity = "0"; el.style.pointerEvents = "none"; // ハズレを消せる
        }
    };
    f.appendChild(el);
}

function nextStage() { 
    active = false; 
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    setTimeout(()=>{cur++; init();}, 600); 
}

function updateTimer() {
    if(!active) return;
    ms--;
    const t = document.getElementById('timer');
    if(ms <= 0) { location.reload(); return; }
    t.innerText = (ms/100).toFixed(2);
    if(ms <= 1000) t.style.color = "red";
}

function end() {
    active = false; clearInterval(tid);
    document.getElementById('field').innerHTML = `
        <div style="padding:20px;">
            <h2 style="color:#d44d5c;">全クリア！</h2>
            <p>SCORE: ${score.toFixed(2)}</p>
            <div class="premium-box" style="margin:20px auto; background:white; color:#333;">
                <p><b>1円募金（支援）のお願い</b></p>
                <a href="https://qr.paypay.ne.jp/p2p01_nSoMCZ93V9DzYia0" target="_blank" class="btn" style="text-decoration:none; display:inline-block; width:80%;">PayPayで支援</a>
            </div>
            <button onclick="location.reload()" class="btn" style="width:200px;">もう一度挑戦</button>
        </div>`;
}
</script>
</body>
</html>
