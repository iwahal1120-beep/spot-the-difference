<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>1円募金 - Search Challenge!</title>
    <style>
        body { text-align:center; font-family: sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        .header { padding: 5px; background: #d44d5c; color: white; height: 110px; box-sizing: border-box; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
        .main-title { font-size: 16px; font-weight: bold; margin: 0; }
        .status-bar { display: flex; justify-content: center; gap: 20px; font-size: 16px; margin-top: 5px; font-weight: bold; }
        #stg-desc { font-size: 12px; background: white; color: #d44d5c; display: inline-block; padding: 2px 10px; border-radius: 15px; margin-top: 3px; width: 90%; }
        #timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; }
        
        /* ターゲット専用：最前面・強調 */
        .target-item {
            z-index: 9000 !important;
            filter: drop-shadow(0 0 10px gold);
            width: 60px !important;
            height: 60px !important;
        }

        .target-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .emoji-item { font-size: 32px; text-align: center; }
        .target-item.emoji-item { font-size: 50px; } /* 銀貨やターゲットを大きく */

        /* 万が一イラストが読み込めない時の特別枠（漢字だけにならないように） */
        .fallback-target { background: #fff; border: 3px solid gold; border-radius: 10px; font-size: 20px !important; font-weight: bold; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; width: 85%; z-index: 20000; border: 5px solid #d4af37; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-weight: bold; text-decoration: none; border-radius: 8px; font-size: 18px; text-align: center; border: none; cursor: pointer; }
        .btn-pay { background: #ff0033 !important; color: #fff !important; }
        .btn-retry { background: #666 !important; color: #fff !important; }
    </style>
</head>
<body>

<div class="header">
    <div class="main-title">1円募金 - Search Challenge!</div>
    <div id="stg-desc">読み込み中...</div>
    <div class="status-bar">
        <div>残り: <span id="timer">30</span>秒</div>
        <div>ステージ: <span id="stage-num">1</span>/10</div>
    </div>
</div>

<div id="game-field" class="game-area"></div>

<div id="modal" class="modal">
    <h2 id="modal-title">タイムアップ！</h2>
    <p>もう一度挑戦しますか？</p>
    <button onclick="window.location.reload();" class="btn btn-retry">最初から遊ぶ</button>
</div>

<script>
const stages = [
    { title: "1. 動物から「人間」を探せ！", crowd: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵"], target: "🙋‍♂️", num: 450, goals: 1 },
    { title: "2. 人間から「猫」を探せ！", crowd: ["🧔","👵","👦","👧","👩‍🦰","👱‍♂️","👳‍♀️","👮‍♂️","👷‍♀️","👩‍⚕️","💂‍♂️"], target: "🐱", num: 450, goals: 1 },
    { title: "3. 渋滞の中から「自転車」を探せ！", crowd: ["🚗","🚕","🚙","🚌","🏎","🚓","🚑","🚒","🚐","🚚","🚛","🚜","🚘"], target: "🚲", num: 450, goals: 1 },
    { title: "4. お菓子から「クッキー」を探せ！", crowd: ["🍬","🍭","🍫","🍩","🍮","🍰","🧁","🥧","🍦","🍨","🍡","🥨"], target: "🍪", num: 450, goals: 1 },
    { title: "5. 500枚の「金貨」から「銀貨1枚」を探せ！", crowd: ["🪙"], target: "🥈", num: 500, goals: 1 },
    { title: "6. 美女の中に…相撲力士が一人！", crowd: ["👩‍🦰","👱‍♀️","👩‍🦳","👩‍🦱","💃","👒"], target: "sumo.png", num: 450, goals: 1 },
    { title: "7. 世界の人々から「5つの国旗」を全部探せ！", crowd: ["🌍","🌎","🌏","🧔","👵","👦","👧"], target: "FLAGS", num: 450, goals: 5 },
    { title: "8. 魚の中に「魚の骨」が！", crowd: ["🐟","🐠","🐡","🦈","🐙","🦑"], target: "fishbone.png", num: 450, goals: 1 },
    { title: "9. 宇宙の中に「梅干し」が1個！", crowd: ["🪐","🌕","⭐","☀️","🌌","☄️"], target: "umeboshi.png", num: 450, goals: 1 },
    { title: "最終：1円募金のお願い", crowd: [], target: "FINAL", num: 0, goals: 1 }
];

let currentStage = 0, timeLeft = 30, timerId = null, gameActive = false, foundCount = 0;
const field = document.getElementById('game-field'), desc = document.getElementById('stg-desc'), timerDisp = document.getElementById('timer'), stageDisp = document.getElementById('stage-num');

function initStage() {
    field.innerHTML = "";
    foundCount = 0;
    if (currentStage >= stages.length) return;

    const stage = stages[currentStage];
    desc.innerText = stage.title;
    stageDisp.innerText = currentStage + 1;
    timeLeft = 30;
    timerDisp.innerText = timeLeft;

    if (stage.target === "FINAL") {
        showFinalScreen();
        return;
    }

    gameActive = true;
    
    // 1. ダミーを先に配置
    for (let i = 0; i < stage.num; i++) {
        createItem(stage.crowd[Math.floor(Math.random() * stage.crowd.length)], false);
    }
    
    // 2. 正解を後に配置（最前面を確保）
    if (stage.target === "FLAGS") {
        const flags = ["🇷🇺", "🇰🇵", "🇨🇳", "🇺🇸", "🇯🇵"];
        // 国旗が「くっつかない」ように等間隔で配置
        flags.forEach((f, idx) => {
            const x = 10 + (idx * 16); // 確実に横に離す
            const y = 30 + (Math.random() * 40);
            createItem(f, true, x, y);
        });
    } else {
        createItem(stage.target, true);
    }

    if(!timerId) startTimer();
}

function createItem(content, isTarget, customX, customY) {
    const el = document.createElement('span');
    el.className = isTarget ? 'item target-item' : 'item';
    
    if (!isTarget) {
        el.style.zIndex = Math.floor(Math.random() * 5000) + 1;
        el.style.left = (Math.random() * 85 + 5) + "%";
        el.style.top = (Math.random() * 85 + 5) + "%";
    } else {
        el.style.left = customX ? customX + "%" : (Math.random() * 80 + 10) + "%";
        el.style.top = customY ? customY + "%" : (Math.random() * 80 + 10) + "%";
    }

    if (content.indexOf(".png") !== -1) {
        const img = document.createElement('img');
        img.className = 'target-img';
        img.src = content + "?v=" + Date.now();
        img.onerror = function() {
            this.style.display = "none";
            el.innerText = content === "sumo.png" ? "力士" : (content === "umeboshi.png" ? "梅" : "骨");
            el.classList.add('emoji-item', 'fallback-target');
        };
        el.appendChild(img);
    } else {
        el.innerText = content;
        el.classList.add('emoji-item');
    }
    
    el.onclick = function(e) {
        if(!gameActive) return;
        e.stopPropagation();

        if (isTarget) {
            if (this.dataset.found === "true") return;
            this.dataset.found = "true";
            this.style.zIndex = "15000";
            this.style.transform = "scale(4) rotate(360deg)";
            this.style.transition = "0.4s";
            this.style.opacity = "0.6";
            
            foundCount++;
            if (foundCount >= stages[currentStage].goals) {
                gameActive = false;
                setTimeout(function() { currentStage++; initStage(); }, 1000);
            }
        } else {
            // ダミーを消す（めくる動作）
            this.style.opacity = "0";
            this.style.pointerEvents = "none";
        }
    };
    field.appendChild(el);
}

function showFinalScreen() {
    gameActive = false;
    clearInterval(timerId);
    timerId = null;
    field.innerHTML = '<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%;">' +
        '<h1 style="color:#d44d5c; font-size:24px;">To Be Continued...</h1>' +
        '<div style="width:85%; border:2px dashed #d44d5c; padding:20px; border-radius:10px; background:#fff; margin:20px 0;">' +
        '<p style="font-weight:bold; font-size:18px;">1円募金（支援）のお願い</p>' +
        '<a href="https://qr.paypay.ne.jp/p2p01_nSoMCZ93V9DzYia0" target="_blank" class="btn btn-pay">PayPayで支援する</a>' +
        '</div>' +
        '<button onclick="window.location.reload();" class="btn btn-retry" style="width:60%;">最初から遊ぶ</button>' +
        '</div>';
}

function startTimer() {
    timerId = setInterval(function() {
        if(gameActive) {
            timeLeft--;
            timerDisp.innerText = timeLeft;
            if(timeLeft <= 0) endGame();
        }
    }, 1000);
}

function endGame() {
    gameActive = false;
    clearInterval(timerId);
    timerId = null;
    document.getElementById('modal').style.display = 'block';
}

window.onload = initStage;
</script>
</body>
</html>
