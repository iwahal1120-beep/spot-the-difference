<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>10万円争奪：Search Challenge GIGA-HARD</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
        body { text-align:center; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 0; overflow: hidden; }
        
        #start-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #000 0%, #1a1a1a 100%); z-index:30000; display:flex; flex-direction:column; align-items:center; color:white; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        
        .premium-box { border: 4px solid #ffd700; padding: 15px; border-radius: 15px; background: rgba(255, 215, 0, 0.15); margin: 10px 0; width: 100%; max-width: 340px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
        .gift-title { color: #ffd700; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin: 5px 0; }
        
        .target-rule { color: #ff4d4d; font-size: 15px; font-weight: bold; background: white; padding: 12px; border-radius: 10px; margin: 10px 0; display: block; line-height: 1.5; width: 95%; box-sizing: border-box; text-align: left; }

        .donation-area { width: 100%; max-width: 340px; margin-bottom: 15px; }
        .btn-ofuse-top { background: #ed6c00; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 15px; font-weight: bold; display: block; margin-bottom: 5px;}
        .support-plans { background: rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; font-size: 11px; color: #ffcc00; text-align: left; border: 1px dashed #ed6c00; }

        .input-group { width: 100%; max-width: 320px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 15px; box-sizing: border-box; }
        input { padding:12px; font-size:16px; border-radius:8px; width:100%; text-align:center; margin-bottom:10px; border:none; box-sizing:border-box; }

        .header { padding: 5px; background: #d44d5c; color: white; height: 110px; box-sizing: border-box; border-bottom: 3px solid #b33a47; position: relative; z-index: 10000; }
        #timer { color: #fff; background: #000; padding: 1px 6px; border-radius: 5px; min-width: 65px; display: inline-block; font-variant-numeric: tabular-nums; }
        .game-area { width: 100vw; height: calc(100vh - 110px); position: relative; background: #fff; overflow: hidden; }
        .inner-field { width: 98%; height: 98%; position: relative; margin: auto; }
        
        .item { position: absolute; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; font-size: 18px; }
        .target-item { z-index: 9999 !important; }
        .mirror { transform: scaleX(-1); }
        
        @keyframes rotate-spiral { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spiral-mode { animation: rotate-spiral 20s linear infinite; font-size: 400px !important; width: 400px !important; height: 400px !important; left: calc(50% - 200px) !important; top: calc(50% - 200px) !important; color: #333; opacity: 0.8; pointer-events: none; }
        .break-line { width: 18px; height: 18px; background: #fff; border-radius: 50%; z-index: 10000 !important; cursor: pointer; border: 1px solid #ccc;}

        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        .shaking { animation: glitch 0.2s infinite; }

        .btn { width:100%; padding:18px; background:linear-gradient(#ff6b6b, #d44d5c); color:white; border:none; border-radius:15px; font-size:20px; font-weight:bold; cursor:pointer; box-shadow: 0 6px 0 #8a2a35; }
    </style>
</head>
<body>

<audio id="sound-pingpong" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
<audio id="sound-warn" src="https://assets.mixkit.co/active_storage/sfx/495/495-preview.mp3" preload="auto"></audio>

<div id="start-screen">
    <h2 style="color:#ffd700; margin-bottom:5px;">Search Challenge!</h2>
    <div class="premium-box">
        <div style="font-size:12px;">2026年12月31日時点 ランキング1位</div>
        <div class="gift-title">10万円分ギフト券</div>
        <span class="target-rule">※本ゲームは誰でも無料で参加可能です。1位入賞者の特定にはパスワードを使用します。</span>
    </div>

    <div class="donation-area">
        <a href="https://ofuse.me/d33e72b9" target="_blank" class="btn-ofuse-top">活動を応援して10万円に挑戦！🚀</a>
        <div class="support-plans">
            <b>応援プランの例 (任意):</b><br>
            ☕️ コーヒー1杯分 (100円〜) ／ 🍱 ランチ1回分 (1,000円〜) ／ 🔥 情熱の応援 (3,000円〜)
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="player-name" placeholder="ニックネーム" maxlength="10">
        <input type="password" id="player-pass" placeholder="パスワード (数字4桁)" maxlength="4" inputmode="numeric">
        <button onclick="startGame()" class="btn">挑戦を開始する！🏆</button>
    </div>

    <div id="top10-list" style="width:100%; max-width:320px; margin-top:10px; font-size:13px; background:rgba(255,255,255,0.1); padding:10px; border-radius:10px;">読み込み中...</div>
    <div style="font-size:10px; color:#aaa; margin-top:10px; text-align:left; width:100%; max-width:320px;">1位確定時、OFUSEのファンレター機能から申告いただくことで本人確認を行います。</div>
</div>

<div class="header">
    <div class="main-title">募金 & Challenge！</div>
    <div id="stg-desc">Ready...</div>
    <div class="status-bar">
        <div>残り: <span id="timer">30.00</span></div>
        <div>ステージ: <span id="stage-num">1</span>/<span id="total-stg-num">25</span></div>
    </div>
</div>

<div class="game-area" id="game-bg">
    <div id="inner-field" class="inner-field"></div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzvFsfk4Zp48AyJgQccCOQMX911-Itey8Sc8VH9ehnSF7J7PDpkPNayzijuO5BOBEQKaw/exec"; 

let currentStage = 0, msLeft = 3000, timerId = null, gameActive = false, foundCount = 0;
let totalTimeScore = 0, playerName = "", playerPass = "";
let existingNames = [], playableStages = [];

const field = document.getElementById('inner-field');
const timerDisp = document.getElementById('timer');
const pingSound = document.getElementById('sound-pingpong');
const warnSound = document.getElementById('sound-warn');

const allStages = [
    { title: "1. 動物から人間！", crowd: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯"], target: "🙋‍♂️", num: 1000 },
    { title: "2. 人間から猫！", crowd: ["🧔","👵","👦","👧","👩‍🦰","👱‍♂️"], target: "🐱", num: 1200 },
    { title: "3. 渋滞から自転車！", crowd: ["🚗","🚕","🚙","🚌","🏎"], target: "🚲", num: 1200 },
    { title: "4. お菓子からクッキー！", crowd: ["🍬","🍭","🍫","🍩","🍮"], target: "🍪", num: 1200 },
    { title: "5. 金貨の山から銀貨！", crowd: ["💰"], target: "🔘", num: 1400 },
    { title: "6. ピエロを探せ！", crowd: ["👩","👱‍♀️","💃"], target: "🤡", num: 1300 },
    { title: "7. 国旗（日米中露北）！", crowd: ["🌍","🌎","🌏"], target: "FLAGS", num: 1000, goals: 5 },
    { title: "8. 魚から骨！", crowd: ["🐟","🐠","🐡"], target: "🦴", num: 1400 },
    { title: "9. 無数の星から梅干し！", crowd: ["✨","⭐","🌟"], target: "🔴", num: 1600 },
    { title: "10. 「あ」の裏返し5個！", crowd: ["あ"], target: "MIRROR_A", num: 500, goals: 5 },
    { title: "11. ビルから鳥居！", crowd: ["🏢","🏣","🏥"], target: "⛩", num: 1200 },
    { title: "12. リンゴからサクランボ！", crowd: ["🍎"], target: "🍒", num: 1200 },
    { title: "13. 葉っぱからイモムシ！", crowd: ["🍃","🌿","🌱"], target: "🐛", num: 1300 },
    { title: "14. スポーツから優勝杯！", crowd: ["⚽","🏀","⚾"], target: "🏆", num: 1200 },
    { title: "15. 月からバナナ！", crowd: ["🌙"], target: "🍌", num: 1400 },
    { title: "16. 違う動物を5匹！", crowd: ["🐼"], target: "DIFFERENT", num: 500, goals: 5 },
    { title: "17. イカからタコ！", crowd: ["🦑"], target: "🐙", num: 1300 },
    { title: "18. 星空に潜むUFO！", crowd: ["✨","⭐","🌟"], target: "🛸", num: 1600 },
    { title: "19. 💩の中からアイス！", crowd: ["💩"], target: "🍦", num: 1200 },
    { title: "20. 【恐怖】開いている目5つ", crowd: ["😑"], target: "👁️", num: 1000, goals: 5, special: "scary" },
    { title: "21. 【笑】おじさんの中に美女5人", crowd: ["🧔"], target: "💃", num: 1000, goals: 5 },
    { title: "22. 【電脳】震えるブロック5つ", crowd: ["🟦"], target: "SHAKE", num: 400, goals: 5, special: "glitch" },
    { title: "23. 【進化】ヒヨコを5匹！", crowd: ["🥚"], target: "CHICK", num: 300, goals: 5, special: "evolve" },
    { title: "24. 【定番】💩の中にアイス5個", crowd: ["💩"], target: "🍦", num: 1500, goals: 5 },
    { title: "25. 【激難】目が回る！断線5箇所", crowd: ["🌀"], target: "SPIRAL_BREAK", num: 1, goals: 5, special: "spiral" },
    { title: "FINAL", crowd: [], target: "FINAL", num: 0 }
];

window.onload = async () => {
    try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        existingNames = data.map(d => d.name.trim());
        const list = document.getElementById('top10-list');
        list.innerHTML = `<div style="font-weight:bold; border-bottom:1px solid #fff; margin-bottom:8px; color:#ffd700;">👑 全国タイム TOP 10</div>` + 
            data.slice(0, 10).map((entry, i) => `<div style="display:flex; justify-content:space-between; padding:3px 0;"><span>${i+1}. ${entry.name}</span><span>${entry.score}s</span></div>`).join('');
    } catch(e) {}
};

function startGame() {
    playerName = document.getElementById('player-name').value.trim();
    playerPass = document.getElementById('player-pass').value.trim();
    if (!playerName || playerPass.length < 4) { alert("名前と4桁のパスワードを入力してください"); return; }
    if (existingNames.includes(playerName)) { alert("その名前は既に使用されています"); return; }
    playableStages = getPlayableStages();
    document.getElementById('total-stg-num').innerText = playableStages.length;
    document.getElementById('start-screen').style.display = 'none';
    initStage();
}

function getPlayableStages() {
    const START_DATE = new Date("2026-02-01");
    const diffWeeks = Math.floor((new Date() - START_DATE) / (1000 * 60 * 60 * 24 * 7));
    const count = Math.min(allStages.length - 1, 24 + Math.max(0, diffWeeks));
    const pool = allStages.slice(0, count);
    pool.push(allStages[allStages.length - 1]);
    return pool;
}

function initStage() {
    field.innerHTML = "";
    foundCount = 0;
    document.getElementById('game-bg').style.background = "#fff";
    if (currentStage >= playableStages.length) return;
    const stage = playableStages[currentStage];
    document.getElementById('stg-desc').innerText = stage.title;
    document.getElementById('stage-num').innerText = currentStage + 1;
    msLeft = 3000;
    timerDisp.style.color = "#fff";
    gameActive = true;

    if (stage.special === "scary") { document.getElementById('game-bg').style.background = "#000"; }
    if (stage.target === "FINAL") { showFinalScreen(); }
    else if (stage.special === "spiral") { createSpiralStage(); }
    else { createStageItems(stage); }
    if(!timerId) startTimer();
}

function createSpiralStage() {
    const spiral = document.createElement('span');
    spiral.className = 'item spiral-mode';
    spiral.innerText = "🌀";
    field.appendChild(spiral);
    for (let i = 0; i < 5; i++) {
        const bl = document.createElement('span');
        bl.className = 'item break-line';
        const a = Math.random() * Math.PI * 2;
        const r = 40 + Math.random() * 110;
        bl.style.left = `calc(50% + ${Math.cos(a) * r}px)`;
        bl.style.top = `calc(50% + ${Math.sin(a) * r}px)`;
        bl.onclick = () => handleFound(bl);
        field.appendChild(bl);
    }
}

function createStageItems(stage) {
    let tCount = 0;
    const maxT = stage.goals || 1;
    let targets = [];
    
    // ステージ7のターゲット（国旗）を個別に定義してバグ回避
    if(stage.target === "FLAGS") {
        targets = ["🇯🇵", "🇺🇸", "🇨🇳", "🇰🇵", "🇷🇺"];
    } else {
        for(let j=0; j<maxT; j++) {
            if(stage.target === "MIRROR_A") targets.push("あ");
            else if(stage.target === "SHAKE") targets.push("🟦");
            else if(stage.target === "DIFFERENT") targets.push(["🐨", "🐻‍❄️"][Math.floor(Math.random()*2)]);
            else targets.push(stage.target);
        }
    }

    // ターゲットの配置
    targets.forEach(tChar => {
        createItem(tChar, true, {x: 5 + Math.random() * 90, y: 5 + Math.random() * 90}, stage);
    });

    // モブの配置
    for (let i = 0; i < stage.num; i++) {
        const char = stage.crowd[Math.floor(Math.random() * stage.crowd.length)];
        createItem(char, false, {x: Math.random()*98, y: Math.random()*98}, stage);
    }
}

function createItem(content, isTarget, pos, stage) {
    const el = document.createElement('span');
    el.className = 'item';
    if (isTarget) el.classList.add('target-item');
    if (stage.target === "MIRROR_A" && isTarget) el.classList.add('mirror');
    if (stage.target === "SHAKE" && isTarget) el.classList.add('shaking');
    
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    if ((content === "🔴" || content === "🍒") && isTarget) el.style.color = "#ffb3b3";
    if (stage.special === "scary" && !isTarget) el.style.opacity = "0.2";
    
    el.innerText = content;
    if (isTarget) el.onclick = (e) => { e.stopPropagation(); handleFound(el); };
    
    if (stage.special === "evolve" && isTarget) {
        el.innerText = "🥚";
        setInterval(() => { if(!el.dataset.clicked) el.innerText = (el.innerText === "🥚") ? "🐥" : "🥚"; }, 800 + Math.random() * 1000);
    }
    field.appendChild(el);
}

function handleFound(el) {
    if(!gameActive || el.dataset.clicked === "true") return;
    if(playableStages[currentStage].special === "evolve" && el.innerText === "🥚") return;
    el.dataset.clicked = "true";
    pingSound.currentTime = 0; pingSound.play().catch(()=>{});
    el.style.transform = "scale(2.5) rotate(360deg)";
    el.style.opacity = "0.5";
    totalTimeScore += (msLeft / 100);
    foundCount++;
    if (foundCount >= (playableStages[currentStage].goals || 1)) {
        gameActive = false;
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
        setTimeout(() => { currentStage++; initStage(); }, 600);
    }
}

function startTimer() {
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
        if(gameActive) {
            msLeft--;
            timerDisp.innerText = (msLeft / 100).toFixed(2);
            if (msLeft === 1000) { warnSound.play().catch(()=>{}); timerDisp.style.color = "red"; }
            if(msLeft <= 0) { gameActive = false; endGame(); }
        }
    }, 10);
}

async function showFinalScreen() {
    gameActive = false; clearInterval(timerId);
    field.innerHTML = `<h2>記録送信中...</h2>`;
    try {
        await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({name: playerName, score: totalTimeScore.toFixed(2), pass: playerPass}) });
        alert("送信完了！"); location.reload(); 
    } catch(e) { location.reload(); }
}

function endGame() { 
    clearInterval(timerId);
    field.innerHTML = `<h2>TIME UP!</h2><button onclick="location.reload();" class="btn">トップへ</button>`; 
}
</script>
</body>
</html>
